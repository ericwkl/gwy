<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8f0e8">
<title>公考学习工作台</title>
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';s.onerror=function(){window.ChartLibLoadFailed=true;};document.head.appendChild(s);})();"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.onerror=function(){window.SupabaseLibLoadFailed=true;};document.head.appendChild(s);})();"></script>
<style>
/* ========== 基础变量 护眼配色 ========== */
:root{
  --bg:#eef3ea;
  --bg-card:#ffffff;
  --bg-soft:#f5f7f1;
  --bg-input:#fafbf7;
  --primary:#5b8a5a;
  --primary-light:#7ba77a;
  --primary-soft:#e3eede;
  --accent:#c08552;
  --accent-soft:#f3e7d8;
  --text:#3a4a3a;
  --text-soft:#7c8a7c;
  --text-light:#a8b2a8;
  --border:#dde5d6;
  --danger:#c75450;
  --danger-soft:#f7e3e2;
  --warning:#d9a441;
  --info:#6b8e9e;
  --shadow:0 2px 8px rgba(60,80,60,.06);
  --shadow-lg:0 6px 24px rgba(60,80,60,.12);
  --radius:14px;
  --radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;outline:none;width:100%;}
input:focus,textarea:focus,select:focus{border-color:var(--primary-light);background:#fff;}
textarea{resize:vertical;min-height:80px;}
img{max-width:100%;display:block;}

/* ========== 顶部 ========== */
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--bg-card);
  padding:10px 16px;
  padding-top:max(calc(env(safe-area-inset-top, 0px) + 8px), 24px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.header-left{flex:1;min-width:0;}
.app-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:.3px;display:flex;align-items:center;gap:4px;}
.app-date{font-size:11px;color:var(--text-soft);margin-top:2px;}
.header-actions{display:flex;gap:8px;}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-soft);transition:all .15s;}
.icon-btn:active{background:var(--primary-soft);color:var(--primary);}

/* ========== 主布局 ========== */
.app-content{
  position:fixed;
  top:0;left:0;right:0;
  bottom:calc(56px + env(safe-area-inset-bottom, 0px));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:12px 12px 20px 12px;
  padding-bottom:calc(56px + env(safe-area-inset-bottom, 0px) + 16px);
  padding-top:max(calc(env(safe-area-inset-top, 0px) + 70px), 86px);
  background:var(--bg);
}
.page{display:none;}
.page.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ========== 底部Tab导航 ========== */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:var(--bg-card);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.tab-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;
  padding:8px 0 6px;
  font-size:11px;
  color:var(--text-light);
  transition:all .15s;
}
.tab-item .tab-ico{font-size:22px;line-height:1;margin-bottom:3px;}
.tab-item.active{color:var(--primary);}
.tab-item:active{background:var(--bg-soft);}

/* ========== 卡片 ========== */
.card{background:var(--bg-card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.card-title .left{flex:1;min-width:0;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-title .emoji{font-size:16px;margin-right:2px;display:inline-block;line-height:1;}
.card-title>div, .card-title>button{flex-shrink:0;}
.section-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--primary-soft);color:var(--primary);}

/* ========== 按钮 ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;background:var(--primary);color:#fff;transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-outline{background:var(--bg-soft);color:var(--primary);border:1px solid var(--primary-soft);}
.btn-ghost{background:transparent;color:var(--text-soft);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-full{width:100%;padding:11px;}
.btn:disabled{opacity:.5;}

/* ========== 倒计时 ========== */
.exam-item{background:var(--bg-soft);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;border-left:3px solid var(--primary);}
.exam-item .info{flex:1;}
.exam-item .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exam-item .date{font-size:10px;color:var(--text-soft);margin-top:1px;}
.exam-item .count{text-align:right;}
.exam-item .days{font-size:17px;font-weight:800;color:var(--primary);line-height:1;}
.exam-item .days-label{font-size:9px;color:var(--text-soft);}
.exam-item .del{margin-left:6px;color:var(--text-light);font-size:15px;}
.exam-item.urgent{border-left-color:var(--danger);}
.exam-item.urgent .days{color:var(--danger);}

/* ========== 板块网格 ========== */
.module-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px;}
.module-card{background:var(--bg-card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.module-card.sy{border-left:3px solid var(--accent);}
.module-card .m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.module-card .m-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;}
.module-card .m-icon{font-size:18px;}
.module-card .m-stats{display:flex;gap:8px;font-size:11px;color:var(--text-soft);margin-bottom:4px;flex-wrap:wrap;}
.module-card .m-stats b{color:var(--text);font-size:15px;font-weight:700;margin:0 2px;}
.module-card .m-rate{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 28px 28px 0;}
.module-card .m-rate span{position:absolute;top:0px;right:-26px;font-size:9px;color:#fff;font-weight:700;}
.module-card .m-add{margin-top:8px;}
.module-card .m-week{font-size:11px;color:var(--primary);margin:4px 0;}
.module-card .m-week b{color:var(--primary);font-weight:700;}
.module-card .m-subs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.module-card .m-sub{font-size:10px;padding:3px 8px;border-radius:10px;background:var(--bg-soft);color:var(--text-light);}
.module-card .m-sub.on{background:var(--primary-soft);color:var(--primary);font-weight:600;}
.module-card .m-empty{text-align:center;font-size:11px;color:var(--text-light);padding:8px 0;margin-top:4px;font-style:italic;}
.module-card .m-recs{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px;}
.module-card .m-rec{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;}
.module-card .m-rec-time{color:var(--text-soft);flex-shrink:0;min-width:34px;}
.module-card .m-rec-info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.module-card .m-rec-btn{background:none;border:none;color:var(--text-soft);font-size:12px;cursor:pointer;padding:0 2px;}
.module-card .m-rec-btn:active{color:var(--primary);}
/* 分组标题 */
.study-groups{display:flex;flex-direction:column;gap:14px;margin-bottom:12px;}
.study-group{display:flex;flex-direction:column;gap:8px;}
.study-group-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;color:#3a4a3a;box-shadow:0 2px 6px rgba(60,80,60,.08);}
.study-group-emoji{font-size:18px;}
.study-group-label{flex:1;letter-spacing:.5px;}
.study-group-meta{font-size:11px;font-weight:400;color:var(--text-soft);}

/* ========== 任务清单 ========== */
.task-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff;}
.task-check.done{background:var(--primary);border-color:var(--primary);}
.task-text{flex:1;font-size:14px;}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-light);}
.task-del{color:var(--text-light);font-size:16px;padding:4px;}

/* ========== 弹窗 ========== */
.modal-mask{position:fixed;inset:0;background:rgba(40,50,40,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-mask.show{display:flex;animation:fade .2s;}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:18px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{font-size:22px;color:var(--text-light);line-height:1;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:5px;}
.form-row{display:flex;gap:8px;}
.form-row>*{flex:1;}
.modal-foot{display:flex;gap:8px;margin-top:14px;}

/* ========== 复盘 / 错题列表项 ========== */
.review-item,.error-item{background:var(--bg-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
.review-item .r-tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;background:var(--primary-soft);color:var(--primary);margin-bottom:6px;}
.review-item .r-time{font-size:11px;color:var(--text-soft);float:right;}
.review-item .r-tpl{font-size:13px;color:var(--text);margin-top:6px;white-space:pre-wrap;word-break:break-word;}
.review-item .r-tpl b{color:var(--primary);}
.review-item .photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
/* 错题详情块 */
.detail-block{background:var(--bg-soft);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap;word-break:break-all;}
.detail-label{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.review-item .photos img{width:70px;height:70px;object-fit:cover;border-radius:8px;}

/* ========== 语音条 微信样式 ========== */
.voice-bar{display:flex;align-items:center;gap:8px;background:var(--primary-soft);border-radius:18px;padding:8px 12px;margin-top:6px;max-width:240px;}
.voice-bar .play-btn{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.voice-bar .wave{flex:1;height:20px;display:flex;align-items:center;gap:2px;}
.voice-bar .wave i{display:block;width:3px;background:var(--primary);border-radius:2px;opacity:.6;}
.voice-bar .dur{font-size:11px;color:var(--primary);flex-shrink:0;}
.voice-bar .vt-text{font-size:11px;color:var(--text-soft);margin-top:4px;width:100%;}
.voice-recorder{display:flex;align-items:center;gap:8px;margin-top:6px;}
.voice-recorder .rec-btn{width:40px;height:40px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.voice-recorder .rec-btn.recording{background:var(--primary);}
.voice-recorder .rec-status{font-size:12px;color:var(--text-soft);}

/* ========== 打卡日历 ========== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cal-head .ym{font-size:13px;font-weight:600;}
.cal-nav{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:13px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-grid .wk{font-size:9px;color:var(--text-light);text-align:center;padding:2px 0;}
.cal-cell{height:30px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:50%;position:relative;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.today{outline:1px solid var(--primary);}
.cal-cell.checked{background:var(--primary);color:#fff;}
.cal-cell.checked .dur-dot{position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:#fff;}
.cal-cell.future{color:var(--text-light);}
.cal-summary{display:flex;justify-content:space-around;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.cal-summary .s-item{text-align:center;}
.cal-summary .s-num{font-size:14px;font-weight:700;color:var(--primary);}
.cal-summary .s-label{font-size:9px;color:var(--text-soft);}

/* ========== 图表容器 ========== */
.chart-box{position:relative;height:200px;margin-top:8px;}

/* ========== 试卷分析 ========== */
.paper-item{background:var(--bg-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
.paper-item .p-head{display:flex;justify-content:space-between;align-items:flex-start;}
.paper-item .p-name{font-size:14px;font-weight:600;}
.paper-item .p-meta{font-size:11px;color:var(--text-soft);margin-top:3px;}
.paper-item .p-score{font-size:22px;font-weight:800;color:var(--primary);}
.paper-item .p-modules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;align-items:stretch;}
.paper-item .p-mod{font-size:10px;line-height:1.5;padding:3px 7px;border-radius:6px;background:#fff;color:var(--text-soft);white-space:normal;word-break:break-all;display:flex;align-items:center;gap:4px;min-height:24px;}
.paper-item .p-note{font-size:12px;color:var(--accent);margin-top:6px;}

/* ========== 知识库 ========== */
.kb-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;}
.kb-tab{padding:5px 12px;border-radius:14px;background:var(--bg-soft);font-size:12px;white-space:nowrap;color:var(--text-soft);}
.kb-tab.active{background:var(--primary);color:#fff;}
.kb-item{background:var(--bg-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;}
.kb-item .k-title{font-size:13px;font-weight:600;}
.kb-item .k-content{font-size:12px;color:var(--text-soft);margin-top:4px;white-space:pre-wrap;}
.kb-item .k-meta{font-size:10px;color:var(--text-light);margin-top:6px;}

/* ========== 推送 ========== */
.push-item{background:var(--bg-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;}
.push-item .ph{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.push-item .ph .badge{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--primary);color:#fff;}
.push-item .ph .time{font-size:10px;color:var(--text-light);}
.push-item .pt{font-size:13px;font-weight:600;margin-bottom:4px;}
.push-item .pc{font-size:12px;color:var(--text-soft);white-space:pre-wrap;}
.push-item .pc a{color:var(--info);}
.push-item .pc .gold{color:var(--accent);font-weight:600;}

/* ========== 空状态 ========== */
.empty-state{text-align:center;padding:30px 10px;color:var(--text-light);}
.empty-state .emoji{font-size:40px;margin-bottom:8px;}
.empty-state .txt{font-size:13px;}

/* ========== Toast ========== */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(40,50,40,.85);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* ========== 滚轮选择器 ========== */
.wheel-picker{display:flex;justify-content:center;gap:4px;margin:10px 0;}
.wheel-col{width:60px;height:140px;overflow:hidden;position:relative;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);}
.wheel-col::before,.wheel-col::after{content:'';position:absolute;left:0;right:0;height:50px;z-index:2;pointer-events:none;}
.wheel-col::before{top:0;background:linear-gradient(to bottom,#fff,transparent);}
.wheel-col::after{bottom:0;background:linear-gradient(to top,#fff,transparent);}
.wheel-col .sel-line{position:absolute;top:50px;height:40px;left:0;right:0;border-top:1px solid var(--primary-soft);border-bottom:1px solid var(--primary-soft);z-index:1;}
.wheel-list{position:absolute;left:0;right:0;top:50px;transform:translateY(0);transition:transform .15s;}
.wheel-list div{text-align:center;height:40px;line-height:40px;font-size:16px;color:var(--text);}
.wheel-label{text-align:center;font-size:12px;color:var(--text-soft);margin-top:4px;}

/* ========== 设置 ========== */
.set-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.set-item:last-child{border-bottom:none;}
.set-item .s-name{font-size:14px;}
.set-item .s-desc{font-size:11px;color:var(--text-soft);margin-top:2px;}
.set-item .s-right{font-size:12px;color:var(--text-soft);}

/* ========== 滚动条隐藏 ========== */
::-webkit-scrollbar{width:0;height:0;}

/* tag list */
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.tag-list .tag{font-size:12px;padding:6px 12px;border-radius:16px;background:var(--bg-soft);color:var(--text-soft);border:1px solid var(--border);cursor:pointer;user-select:none;transition:all .15s;display:inline-flex;align-items:center;gap:3px;}
.tag-list .tag:active{transform:scale(.94);}
.tag-list .tag.on{background:var(--primary);color:#fff;border-color:var(--primary);}

</style>
</head>
<body>

<!-- 顶部 -->
<div class="app-header">
  <div class="header-left">
    <div class="app-title">📚 公考学习工作台</div>
    <div class="app-date" id="headerDate"></div>
    <div style="font-size:10px;color:var(--text-light);margin-top:2px;">v2.2.18</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="syncBadgeBtn" onclick="showSyncStatus()" title="云端同步状态" style="position:relative;width:auto;padding:0 10px;font-size:11px;border-radius:20px;background:var(--bg-soft);display:flex;align-items:center;gap:4px;">
      <span id="syncDot" style="width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block;"></span>
      <span id="syncBadgeText">同步</span>
    </button>
    <button class="icon-btn" onclick="showPushPage()" title="推送">🔔</button>
    <button class="icon-btn" onclick="navTo('settings')" title="设置">⚙️</button>
    <button class="icon-btn" onclick="showMoreMenu()" title="更多">⋯</button>
  </div>
</div>

<!-- 主体 -->
<main class="app-content">
  <div class="page active" id="page-home"></div>
  <div class="page" id="page-plan"></div>
  <div class="page" id="page-study"></div>
  <div class="page" id="page-stats"></div>
  <div class="page" id="page-paper"></div>
  <div class="page" id="page-accu"></div>
  <div class="page" id="page-settings"></div>
  <div class="page" id="page-push"></div>
</main>

<!-- 底部Tab导航 -->
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>


<script>
/* ============================================================
   公考学习工作台  核心逻辑

];
const KB_CATS = ['言语理解','常识','政治理论','时政','申论小题积累','申论作文素材','面试'];
const STORAGE_KEY = 'gk_workbench_v1';

/* ---------- 数据层 ---------- */
let DB = null;
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DB = JSON.parse(raw); }
  }catch(e){ console.error(e); }
  // 字段兜底：旧版本数据可能缺少新字段（如 weekTasks），补默认值避免丢失/报错
  if(DB){
    if(!Array.isArray(DB.weekTasks)) DB.weekTasks=[];
    if(!Array.isArray(DB.mistakes)) DB.mistakes=[];
    if(!Array.isArray(DB.knowledge)) DB.knowledge=[];
    if(!Array.isArray(DB.pushHistory)) DB.pushHistory=[];
    if(!Array.isArray(DB.studyProgress)) DB.studyProgress=[];
    if(!DB.settings||typeof DB.settings!=='object') DB.settings={};
  }
  // 迁移：旧版"申论"分类 → 拆为"申论小题积累"+"申论作文素材"
  if(DB && DB.kbCats && DB.kbCats.includes('申论')){
    DB.kbCats = DB.kbCats.filter(c=>c!=='申论');
    if(!DB.kbCats.includes('申论小题积累')) DB.kbCats.push('申论小题积累');
    if(!DB.kbCats.includes('申论作文素材')) DB.kbCats.push('申论作文素材');
    (DB.knowledge||[]).forEach(k=>{ if(k.cat==='申论') k.cat='申论作文素材'; });
    saveDB();
  }
  // 迁移：新增"时政"分类
  if(DB && DB.kbCats && !DB.kbCats.includes('时政')){
    DB.kbCats.push('时政');
    saveDB();
  }
  if(!DB){
    DB = {
      exams:[],            // {id,name,date}
      records:[],          // 刷题记录 {id,module,date,total,correct,duration}
      tasks:[],            // {id,text,done,date}
      reviews:[],          // 复盘 {id,module,date,template,photos:[],audio,audioText}
      errors:[],           // 错题 {id,module,date,desc,answer,point,photos:[],audio,audioText}
      studyCheckins:{},    // 'YYYY-MM-DD' -> hours
      sportCheckins:{},    // 'YYYY-MM-DD' -> hours
      papers:[],           // {id,name,type,examType,date,score,duration,modules:{},note}  examType: 国考/广东省考（仅模考）
      knowledge:[],        // {id,cat,title,content,date}
      tomatoModStats:{},   // {pd:minutes, yy:minutes, ...} 番茄ToDo按模块专注分钟
      schedule:[],         // {id,time,endTime,content,note} 作息规划（时间段）
      weekTasks:[],        // {id,day(1-7),text,done} 每周计划
      mistakes:[],         // {id,module,point,note} 易错考点
      errorEbb:{},         // 错题艾宾浩斯复习状态 {id:{stage,base,next,done}}
      mistakeEbb:{},       // 易错考点艾宾浩斯复习状态
      kbCats:[...KB_CATS],
      settings:{lastPush:''},
      pushHistory:[],      // 推送历史
      studyProgress:[],    // 刷题进度 {id,module,sub,book,status,note,date}
      deletedIds:{},       // 墓碑：各模块已删除记录的 id（{mistakes:[id], errors:[id], ...}），同步时云端/本地都剔除，防止"删了又被同步回来"（v2.1.80）
    };
    saveDB();
  }
}
function saveDB(){
  // 记录最后修改时间（云端同步冲突时按时间比较，最新者胜）
  try{ if(DB && DB.settings){ DB.settings.lastModified = Date.now(); } }catch(e){}
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  // 自动同步开启时，数据改动后防抖推送到云端
  if(!_syncPushing) scheduleSyncPush();
}
/* 墓碑标记：记录某模块被删除记录的 id，删除时调用。
   同步合并时会同时从本地和云端剔除这些 id，确保"删除"能同步到所有设备，
   不会因为其他设备残留的旧数据又把已删除的条目同步回来（v2.1.80） */
function markDeleted(module, id){
  try{
    if(!DB.deletedIds || typeof DB.deletedIds !== 'object') DB.deletedIds = {};
    if(!DB.deletedIds[module]) DB.deletedIds[module] = [];
    if(id && !DB.deletedIds[module].includes(id)) DB.deletedIds[module].push(id);
  }catch(e){}
}
/* ---------- IndexedDB：持久化系统文件夹句柄（FileSystemDirectoryHandle 无法存入localStorage） ---------- */
function idbOpen(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('gk_workbench_fs',1);
      r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
function idbGet(k){
  return new Promise(async res=>{
    try{ const db=await idbOpen(); const t=db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>res(undefined); }catch(e){ res(undefined); }
  });
}
function idbSet(k,v){
  return new Promise(async res=>{
    try{ const db=await idbOpen(); const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k); t.onsuccess=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); }
  });
}
function idbDel(k){
  return new Promise(async res=>{
    try{ const db=await idbOpen(); const t=db.transaction('kv','readwrite').objectStore('kv').delete(k); t.onsuccess=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); }
  });
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
/* 本地日期格式化（避免toISOString的UTC时区偏移，中国时区早上会差一天） */
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function todayStr(){ return localDateStr(new Date()); }
function fmtDate(d){ return d; }

/* ---------- Toast ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 导航 ---------- */
function navTo(name){
  // 记忆最后停留页面：写入 URL hash（浏览器原生历史机制，从外链返回时 hash 自动恢复，比 localStorage 可靠）
  try{ localStorage.setItem('gk_last_tab',name); }catch(e){}
  try{
    // replaceState：不产生额外历史记录；home 时清空 hash
    if(name==='home') history.replaceState(null,'',location.pathname);
    else history.replaceState(null,'','#'+name);
  }catch(e){}
  studyModuleFilter = null;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(n=>n.classList.remove('active'));
  const page = document.getElementById('page-'+name);
  if(page) page.classList.add('active');
  // 高亮底部Tab
  const tabEl = document.querySelector('.tab-item[data-page="'+name+'"]');
  if(tabEl) tabEl.classList.add('active');
  // 渲染对应页面
  renderPage(name);
  const content = document.querySelector('.app-content');
  if(content) content.scrollTop = 0;
}

/* ============================================================
   艾宾浩斯记忆复习：错题 + 易错考点
   规律：录入后第 1 / 2 / 4 / 7 / 15 天各复习一次，
   未点「已掌握」（或点「待复习」）则明天继续显示，
   完成全部 5 轮复习后彻底记住，不再出现在待复习
   ============================================================ */
const EBB_DAYS=[0,1,2,4,7,15]; // 标准艾宾浩斯间隔：录入当天=第1轮；完成第N轮后隔 EBB_DAYS[N] 天（1/2/4/7/15），共6轮（stage 0→6）
function ebbNextDate(base, stage){ // （未使用）旧绝对排期算法，间隔统一改由"完成日+EBB_DAYS[stage]"计算
  const d=new Date(base+'T00:00:00');
  d.setDate(d.getDate() + (EBB_DAYS[stage]-1));
  return localDateStr(d);
}
function ebbInit(base){
  // 录入日 = 第1天：当天即可复习（base=today → next=today 立即显示；过去录入 → 已过期显示）
  return {stage:0, base, next:base, done:false};
}
/* 兼容旧数据：stage0 且今天新增但 next 被设为明天（旧版bug）→ 修正为今天可复习；
   用户主动点过「待复习」的状态（pending=true）不做修正 */
function ebbFixOld(st){
  if(st && st.stage===0 && !st.done && !st.pending && st.base===todayStr() && st.next>todayStr()){
    st.next=todayStr();
  }
  return st;
}
function getErrorEbb(e){
  if(!DB.errorEbb) DB.errorEbb={};
  if(!DB.errorEbb[e.id]) DB.errorEbb[e.id]=ebbInit(e.date||todayStr());
  return ebbFixOld(DB.errorEbb[e.id]);
}
function getMistakeEbb(m){
  if(!DB.mistakeEbb) DB.mistakeEbb={};
  if(!DB.mistakeEbb[m.id]) DB.mistakeEbb[m.id]=ebbInit(m.date||todayStr());
  return ebbFixOld(DB.mistakeEbb[m.id]);
}
/* 今日待复习错题（艾宾浩斯） */
function renderTodayErrorEbb(){
  const today=todayStr();
  const errs=DB.errors.filter(e=>{const st=getErrorEbb(e); return !st.done && st.next<=today;});
  if(!errs.length) return '<div class="empty-state" style="padding:14px;"><div class="emoji">✅</div><div class="txt">今日无待复习错题，保持节奏！</div></div>';
  return errs.slice(0,5).map(e=>{
    const st=getErrorEbb(e);
    const mod=MODULES.find(m=>m.key===e.module);
    const badge=mod?mod.name+(e.sub?'·'+e.sub:''):'未分类';
    const round=st.stage+1;
    return `<div style="display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);">
      <span style="flex-shrink:0;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);white-space:nowrap;">${badge}</span>
      <span style="flex-shrink:0;font-size:10px;color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:6px;">第${round}轮</span>
      <span style="flex:1;min-width:0;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;" onclick="viewErrorDetail('${e.id}')">${escapeHtml(e.desc||'无题目')}</span>
      <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;background:var(--primary);color:#fff;flex-shrink:0;" onclick="ebbErrorAction('${e.id}','master')">已掌握</button>
      <button class="btn btn-sm btn-outline" style="padding:2px 8px;font-size:11px;flex-shrink:0;" onclick="ebbErrorAction('${e.id}','again')">待复习</button>
    </div>`;
  }).join('');
}
/* 今日待复习易错考点（艾宾浩斯，与错题同一套逻辑） */
function renderTodayMistakeEbb(){
  const today=todayStr();
  const mkts=(DB.mistakes||[]).filter(m=>{const st=getMistakeEbb(m); return !st.done && st.next<=today;});
  if(!mkts.length) return '<div class="empty-state" style="padding:14px;"><div class="emoji">✅</div><div class="txt">今日无待复习考点</div></div>';
  return mkts.slice(0,5).map(m=>{
    const st=getMistakeEbb(m);
    const mod=MODULES.find(x=>x.key===m.module)||MODULES.find(x=>x.name===m.module);
    const round=st.stage+1;
    return `<div style="display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);">
      <span style="flex-shrink:0;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--warning-soft);color:var(--warning);white-space:nowrap;">${mod?mod.name:'未分类'}${m.sub?'·'+m.sub:''}</span>
      <span style="flex-shrink:0;font-size:10px;color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:6px;">第${round}轮</span>
      <span style="flex:1;min-width:0;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;" onclick="viewMistakeDetail('${m.id}')">${escapeHtml(m.point||'')}</span>
      <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;background:var(--primary);color:#fff;flex-shrink:0;" onclick="ebbMistakeAction('${m.id}','master')">已掌握</button>
      <button class="btn btn-sm btn-outline" style="padding:2px 8px;font-size:11px;flex-shrink:0;" onclick="ebbMistakeAction('${m.id}','again')">待复习</button>
    </div>`;
  }).join('');
}
function ebbErrorAction(id, action){
  const e=DB.errors.find(x=>x.id===id); if(!e) return;
  const st=getErrorEbb(e);
  if(action==='master'){
    delete st.pending;
    st.stage++;
    if(st.stage>=6){ st.done=true; st.next=''; toast('🎉 6轮复习完成，彻底记住！'); }
    else{
      // v2.2.18：完成第N轮后隔 EBB_DAYS[N] 天（2/4/7/15）。原错位用 EBB_DAYS[N-1]（1/2/4/7），
      // 导致 15号完成第二轮 → 17号（隔2天）；正确应为 19号（隔4天）
      const d=new Date(); d.setDate(d.getDate()+EBB_DAYS[st.stage]);
      st.next=localDateStr(d);
      toast('已掌握！第'+(st.stage+1)+'轮在 '+st.next.slice(5)+' 复习');
    }
  }else{
    st.pending=true; // 标记用户主动推迟，避免旧数据修正逻辑干扰
    const d=new Date(); d.setDate(d.getDate()+1);
    st.next=localDateStr(d);
    toast('已标记待复习，明天继续');
  }
  saveDB(); renderHome();
}
function ebbMistakeAction(id, action){
  const m=(DB.mistakes||[]).find(x=>x.id===id); if(!m) return;
  const st=getMistakeEbb(m);
  if(action==='master'){
    delete st.pending;

/* 考点按子模块分组（子模块顺序按 MODULES.subs，无子模块排最后），组内时间倒序 */
function renderMkSubGrouped(items){
  const bySub={};
  items.forEach(m=>{ const s=m.sub||''; bySub[s]=(bySub[s]||[]).concat(m); });
  const sampleMod=MODULES.find(m=>m.key===items[0].module);
  const subsOrder=(sampleMod&&sampleMod.subs)||[];
  const subKeys=Object.keys(bySub).sort((a,b)=>{
    if(!a) return 1;
    if(!b) return -1;
    const ia=subsOrder.indexOf(a), ib=subsOrder.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  return subKeys.map(s=>{
    const sItems=bySub[s];
    const header=s?`<div style="display:flex;align-items:center;gap:6px;margin:8px 0 4px 4px;">
      <span style="font-size:12px;font-weight:600;color:var(--accent);">▸ ${s}</span>

    </div>`:'';
    return header+sItems.map(m=>mkItemHtml(m)).join('');
  }).join('');
}

/* 已掌握/待复习后 → 自动打开下一条待复习考点（跳到当前题的下一题，不回第一条） */
function nextMistakeDetail(currentId){
  const today=todayStr();
  // 用完整列表找当前位置（当前题已被标记掌握，不在待复习列表中了）
  let fullList = [...(DB.mistakes||[])];
  // 如果有模块筛选，应用筛选
  if(ebbMkFilter) fullList = fullList.filter(m=>m.module===ebbMkFilter);
  const currentIdx = currentId ? fullList.findIndex(x=>x.id===currentId) : -1;
  // 从当前位置往后找下一个待复习的
  if(currentIdx >= 0){
    for(let i = currentIdx + 1; i < fullList.length; i++){
      const st = getMistakeEbb(fullList[i]);
      if(!st.done && st.next <= today){
        viewMistakeDetail(fullList[i].id);
        return;
      }
    }
    // 往后没找到，从头绕回找
    for(let i = 0; i < currentIdx; i++){
      const st = getMistakeEbb(fullList[i]);
      if(!st.done && st.next <= today){
        viewMistakeDetail(fullList[i].id);
        return;
      }
    }
  }
  // 兜底：任意待复习的第一条
  const dueList=(DB.mistakes||[]).filter(x=>{const st=getMistakeEbb(x); return !st.done && st.next<=today;});
  if(dueList.length){ viewMistakeDetail(dueList[0].id); }
  else{ closeModal(); renderPage(currentPageName()); toast('🎉 今日考点复习完成！'); }
}
function delMistakeFromDetail(id){
  if(!confirm('删除此考点？')) return;
  // 先找到当前列表中下一条考点（删除前查找）
  const today=todayStr();
  const fn=_detailReturnFnMistake;
  const list = fn==='showAllMistakeEbb'
    ? (DB.mistakes||[]).filter(x=>{const st=getMistakeEbb(x); return !st.done && st.next<=today;})
    : [...(DB.mistakes||[])];
  const idx = list.findIndex(x=>x.id===id);
  const nextItem = list[idx+1] || list[idx-1];
  
  markDeleted('mistakes', id);
  DB.mistakes=DB.mistakes.filter(x=>x.id!==id);
  if(DB.mistakeEbb) delete DB.mistakeEbb[id];
  saveDB();
  
  if(nextItem){ viewMistakeDetail(nextItem.id); } // openModal不清理跟踪变量
  else if(fn){ closeModal(); setTimeout(()=>window[fn](),50); } // 没有下一条，回列表
  else{ closeModal(); renderPage(currentPageName()); toast('已删除'); }
}

/* ============================================================
   渲染：计划页（作息规划表 + 每日任务 + 每周计划）
   ============================================================ */
function renderPlan(){
  const today = todayStr();
  const now = new Date();
  const weekIdx = now.getDay(); // 0=周日
  // 周计划：本周（周一到周日）
  const monday = new Date(now); monday.setDate(now.getDate() - (weekIdx===0?6:weekIdx-1));
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    days.push({idx:i+1, date:localDateStr(d), isToday: localDateStr(d)===today});
  }
  const scheduleHtml = `<div class="card">
    <div class="card-title"><span class="left"><span class="emoji">📅</span>作息规划表</span>
      <button class="btn btn-sm btn-outline" onclick="scheduleModal()">+ 新增</button></div>
    <div id="scheduleList">${renderScheduleList()}</div>
  </div>`;
  // migrateDailyToWeekly 只做一次性搬运（有 DB.tasks 才执行），不放 renderPlan 里也安全
  migrateDailyToWeekly();
  // 注意：resetWeekDoneIfNeeded 已移到 syncPullAndMerge 后和 init 延迟中执行，
  // 不在 renderPlan 里调用——防止同步前用旧的 lastWeekMonday 误重置，
  // 导致 done=false(updatedAt=now) 比云端 done=true 更新，合并时覆盖平板数据
  const weekHtml = `<div class="card">
    <div class="card-title"><span class="left"><span class="emoji">🗓️</span>周计划</span>
      <button class="btn btn-sm btn-ghost" onclick="weekClearDone()">清理已完成</button></div>
    <div style="font-size:11px;color:var(--text-light);margin:-4px 0 8px;">已自动合并每日任务到对应星期 · 点日期查看当天安排</div>
    ${renderWeekTabs(days)}
    ${renderWeekDayList(days)}
  </div>`;
  document.getElementById('page-plan').innerHTML = scheduleHtml + weekHtml;
}
/* 历史每日任务 → 周计划（一次性搬运：全部迁移后清空每日任务，避免删除后复活/重复迁移） */
function migrateDailyToWeekly(){
  if(!DB.tasks||!DB.tasks.length) return;
  if(!DB.weekTasks) DB.weekTasks=[];
  let migrated=0;
  DB.tasks.forEach(t=>{
    const d=new Date(t.date+'T00:00:00');
    if(isNaN(d.getTime())) return;
    const day=(d.getDay()+6)%7+1; // 1=周一…7=周日
    if(!DB.weekTasks.some(w=>w.day===day&&w.text===t.text)){
      DB.weekTasks.push({id:uid(),day,text:t.text,done:!!t.done,updatedAt:Date.now()});
      migrated++;
    }
  });
  if(migrated){
    // 一次性搬运完成：清空每日任务（此后统一用周计划管理，删除/清理不会复活）
    DB.tasks=[];
    saveDB();
  }
}
/* 新周自动重置：本周一日期与上次记录不同时，把所有 weekTasks 的 done 重置为 false。
   记录本周一日期到 DB.settings.lastWeekMonday，防止重复重置。 */
function resetWeekDoneIfNeeded(monday){
  const mondayStr=localDateStr(monday);
  if(!DB.settings) DB.settings={};
  if(DB.settings.lastWeekMonday !== mondayStr){
    let changed=false;
    (DB.weekTasks||[]).forEach(t=>{
      if(t.done){
        t.done=false;
        t.updatedAt=Date.now();
        changed=true;
      }
    });
    DB.settings.lastWeekMonday=mondayStr;
    if(changed) saveDB();
  }
}
/* 周计划：横向星期选择（今天默认选中），下方显示当天任务 */
let weekTab=-1; // 当前选中星期索引(0-6)，-1=自动定位今天
function renderWeekTabs(days){
  const weekNames=['周一','周二','周三','周四','周五','周六','周日'];
  if(weekTab<0 || weekTab>=7){ weekTab=days.findIndex(d=>d.isToday); if(weekTab<0) weekTab=0; }
  return `<div style="display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;">
    ${days.map((d,i)=>{
      const tasks=(DB.weekTasks||[]).filter(t=>t.day===d.idx);
      const done=tasks.filter(t=>t.done).length;
      const active=weekTab===i;
      return `<div style="flex-shrink:0;min-width:52px;text-align:center;padding:6px 8px;border-radius:10px;cursor:pointer;${active?'background:var(--primary);color:#fff;':'background:var(--bg-soft);color:var(--text);border:1px solid '+(d.isToday?'var(--primary)':'transparent')+';'}" onclick="setWeekTab(${i})">
        <div style="font-size:12px;font-weight:600;white-space:nowrap;">${weekNames[i]}${d.isToday?'·今':''}</div>
        <div style="font-size:10px;opacity:.75;margin-top:1px;">${tasks.length?done+'/'+tasks.length:'无'}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function setWeekTab(i){ weekTab=i; renderPlan(); }
/* 周计划：选中日期的任务列表 */
function renderWeekDayList(days){
  const weekNames=['周一','周二','周三','周四','周五','周六','周日'];
  const d=days[weekTab]||days.find(x=>x.isToday)||days[0];
  const tasks=(DB.weekTasks||[]).filter(t=>t.day===d.idx);
  const rows=tasks.length?tasks.map(t=>`
    <div style="display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--border);">
      <span style="flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1.5px solid ${t.done?'var(--primary)':'var(--border)'};display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:${t.done?'var(--primary)':'transparent'};cursor:pointer;" onclick="toggleWeekTask('${t.id}')">✓</span>
      <span style="flex:1;min-width:0;font-size:12px;color:var(--text);${t.done?'text-decoration:line-through;color:var(--text-light);':''}">${escapeHtml(t.text)}</span>
      <button class="task-del" onclick="weekTaskModal(${d.idx},'${t.id}')">编辑</button>
      <button class="task-del" onclick="delWeekTask('${t.id}')">✕</button>
    </div>`).join(''):'<div style="font-size:11px;color:var(--text-light);padding:6px 0;">暂无安排，点右上角「+ 任务」添加</div>';
  return `<div style="border:1px solid ${d.isToday?'var(--primary)':'var(--border)'};border-radius:10px;padding:8px 10px;${d.isToday?'background:var(--primary-soft);':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <span style="font-size:12px;font-weight:700;color:${d.isToday?'var(--primary)':'var(--text)'};">${weekNames[weekTab]} ${d.date.slice(5)}${d.isToday?'（今天）':''}</span>
      <span style="display:flex;gap:6px;align-items:center;">
        ${tasks.length?`<span style="font-size:10px;color:var(--text-light);">${tasks.filter(t=>t.done).length}/${tasks.length}</span>`:''}
        <button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:11px;" onclick="weekTaskModal(${d.idx})">+ 任务</button>
      </span>
    </div>
    ${rows}
  </div>`;
}
/* 清理已完成任务：取消勾选状态（不删除任务），重置为新一周 */
function weekClearDone(){
  const doneCount=(DB.weekTasks||[]).filter(t=>t.done).length;
  if(!doneCount){ toast('没有已完成的任务'); return; }
  if(!confirm('取消所有已勾选完成的任务状态？（'+doneCount+'项，任务不删除，仅重置为未完成）')) return;
  DB.weekTasks.forEach(t=>{
    if(t.done){
      t.done=false;
      t.updatedAt=Date.now();
    }
  });
  saveDB(); renderPlan(); toast('已重置 '+doneCount+' 项任务为未完成');
}
function weekTaskModal(day, id){
  let t=null;
  if(id) t=DB.weekTasks.find(x=>x.id===id);
  const weekNames=['周一','周二','周三','周四','周五','周六','周日'];
  openModal(`<div class="modal-head"><h3>${id?'编辑':'新增'}任务（${weekNames[day-1]}）</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>任务内容</label><input id="wt_text" value="${t?t.text:''}" placeholder="如：完成一套行测真题并复盘"></div>
    <div class="modal-foot"><button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
    <button class="btn" style="flex:1" onclick="saveWeekTask(${day},'${id||''}')">保存</button></div>`);
  setTimeout(()=>{const i=document.getElementById('wt_text'); if(i) i.focus();},150);
}
function saveWeekTask(day, id){
  const text=document.getElementById('wt_text').value.trim();
  if(!text){ toast('请输入任务'); return; }
  if(!DB.weekTasks) DB.weekTasks=[];
  if(id){
    const t=DB.weekTasks.find(x=>x.id===id);
    if(t){ t.text=text; t.updatedAt=Date.now(); } // 编辑任务名必须更新时间戳，否则合并时不生效（v2.2.18）
  }else{
    DB.weekTasks.push({id:uid(),day,text,done:false,updatedAt:Date.now()});
  }
  saveDB(); closeModal(); renderPlan(); toast('已保存');
}
function toggleWeekTask(id){
  const t=DB.weekTasks.find(x=>x.id===id);
  if(t){ t.done=!t.done; t.updatedAt=Date.now(); saveDB(); renderPlan(); }
}
function delWeekTask(id){
  if(!confirm('删除此任务？')) return;
  markDeleted('weekTasks', id);
  DB.weekTasks=DB.weekTasks.filter(x=>x.id!==id);
  saveDB(); renderPlan();
}

/* 作息规划表渲染与操作 */
function renderScheduleList(){
  if(!DB.schedule||!DB.schedule.length) return '<div class="empty-state"><div class="emoji">📅</div><div class="txt">暂无作息规划，点击"新增"添加</div></div>';
  // 按数组顺序显示（新增时自动按时间插入，可用 ↑↓ 手动调整）
  const list=DB.schedule;
  return list.map((s,idx)=>{
    const timeRange = s.endTime?`${s.time}-${s.endTime}`:(s.time||'--:--');
    return `<div class="schedule-item" style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">
    <div style="flex-shrink:0;min-width:88px;font-size:12px;font-weight:700;color:var(--primary);">${timeRange}</div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;color:var(--text);">${escapeHtml(s.content||'')}</div>

      <button class="task-del" onclick="scheduleModal('${s.id}')">编辑</button>
      <button class="task-del" onclick="delSchedule('${s.id}')">✕</button>
    </div>
  </div>`;
  }).join('');
}
/* 调整作息顺序（数组顺序即显示顺序） */
function moveSchedule(id, dir){
  if(!DB.schedule) return;
  const idx=DB.schedule.findIndex(x=>x.id===id);
  if(idx<0) return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=DB.schedule.length){ toast('已在边缘'); return; }
  [DB.schedule[idx],DB.schedule[swapIdx]]=[DB.schedule[swapIdx],DB.schedule[idx]];
  saveDB(); renderPlan();
}
function scheduleModal(id){
  let s=null;
  if(id) s=DB.schedule.find(x=>x.id===id);
  openModal(`<div class="modal-head"><h3>${id?'编辑':'新增'}作息</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>时间段（开始 - 结束）</label>
      <div class="form-row" style="align-items:center;gap:6px;">
        <input type="time" id="sc_time" value="${s?s.time||'':''}" style="flex:1;">
        <span style="font-size:13px;color:var(--text-light);">至</span>
        <input type="time" id="sc_endtime" value="${s?s.endTime||'':''}" style="flex:1;">
      </div>
      <div style="font-size:11px;color:var(--text-light);margin-top:4px;">如 07:00 至 07:30；不填结束时间则只显示开始时间</div>
    </div>
    <div class="form-group"><label>日程内容</label><input id="sc_content" value="${s?s.content||'':''}" placeholder="如：起床吃早餐"></div>
    <div class="form-group"><label>备注（可选）</label><input id="sc_note" value="${s?s.note||'':''}" placeholder="如：吃燕麦+鸡蛋"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1" onclick="saveSchedule('${id||''}')">保存</button>
    </div>`);
}
function saveSchedule(id){
  const time=document.getElementById('sc_time').value;
  const endTime=document.getElementById('sc_endtime').value;
  const content=document.getElementById('sc_content').value.trim();
  const note=document.getElementById('sc_note').value.trim();
  if(!time||!content){ toast('请填写时间（开始）和内容'); return; }
  if(!DB.schedule) DB.schedule=[];
  if(id){
    const s=DB.schedule.find(x=>x.id===id);
    Object.assign(s,{time,endTime,content,note,updatedAt:Date.now()});
  }else{
    // 新增时按开始时间插入，保持默认时间有序（之后可 ↑↓ 手动调整）
    const item={id:uid(),time,endTime,content,note,updatedAt:Date.now()};
    let insertIdx=DB.schedule.findIndex(x=>x.time>=time);
    if(insertIdx<0) DB.schedule.push(item);
    else DB.schedule.splice(insertIdx,0,item);
  }
  saveDB(); closeModal(); renderPlan(); toast('已保存');
}
function delSchedule(id){
  if(!confirm('删除此作息？')) return;
  markDeleted('schedule', id);
  DB.schedule=DB.schedule.filter(x=>x.id!==id);
  saveDB(); renderPlan();
}

function renderErrorList(limit){
  const list = [...DB.errors].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit||100);
  if(!list.length) return '<div class="empty-state"><div class="emoji">📚</div><div class="txt">暂无错题记录</div></div>';

function renderFullErrorList(){
  let list=[...DB.errors].sort((a,b)=>b.date.localeCompare(a.date));

/* 按子模块分组排序（同一子模块排在一起；子模块顺序按 MODULES.subs；无子模块排最后） */
function renderSubGrouped(items){
  const bySub={};
  items.forEach(e=>{ const s=e.sub||''; bySub[s]=(bySub[s]||[]).concat(e); });
  const sampleMod=MODULES.find(m=>m.key===items[0].module);
  const subsOrder=(sampleMod&&sampleMod.subs)||[];
  const subKeys=Object.keys(bySub).sort((a,b)=>{
    if(!a) return 1;
    if(!b) return -1;
    const ia=subsOrder.indexOf(a), ib=subsOrder.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  return subKeys.map(s=>{
    const sItems=bySub[s];
    const header=s?`<div style="display:flex;align-items:center;gap:6px;margin:8px 0 4px 4px;">
      <span style="font-size:12px;font-weight:600;color:var(--accent);">▸ ${s}</span>

    </div>`:'';
    return header+sItems.map(e=>errorItemHtml(e,'es_'+items[0].module+'_'+s)).join('');
  }).join('');
}

  // 找到音频数据（兼容所有渲染前缀：r_/e_/rv_/vd_/ra_/rk_ 等）

/* 图片全屏查看器：支持缩放（按钮/双击/双指） */
let _imgScale=1;
let _imgPinch=null;
function previewImg(src){
  closeImgViewer();
  const wrap=document.createElement('div');
  wrap.id='imgViewerWrap';
  wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;';
  wrap.innerHTML=`

    <div style="color:#fff;font-size:12px;opacity:.7;margin-top:12px;text-align:center;">双击或按钮缩放 · 拖动查看细节</div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;" onclick="zoomImg(-0.5)">−</button>
      <button style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px;" onclick="resetImgZoom()">原</button>
      <button style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;" onclick="zoomImg(0.5)">＋</button>
      <button style="height:44px;padding:0 18px;border-radius:22px;background:rgba(255,255,255,.9);color:#333;font-size:13px;font-weight:600;" onclick="closeImgViewer()">关闭</button>
    </div>`;
  document.body.appendChild(wrap);
  _imgScale=1;
  const img=wrap.querySelector('#imgView');
  // 双击缩放
  img.addEventListener('dblclick',e=>{ zoomImg(_imgScale>1?-0.5:0.75); e.preventDefault(); });
  // 双指缩放
  img.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      _imgPinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), s:_imgScale};
    }
  },{passive:true});
  img.addEventListener('touchmove',e=>{
    if(_imgPinch&&e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      const s=_imgPinch.s*(d/_imgPinch.d);
      _imgScale=Math.max(0.5,Math.min(4,s));
      img.style.transform=`scale(${_imgScale})`;
    }
  },{passive:true});
  img.addEventListener('touchend',e=>{ if(e.touches.length<2) _imgPinch=null; });
  // 单击关闭
  img.addEventListener('click',()=>{ if(_imgScale<=1) closeImgViewer(); });
}
function zoomImg(delta){
  _imgScale=Math.max(0.5,Math.min(4,_imgScale+delta));
  const img=document.getElementById('imgView');
  if(img) img.style.transform=`scale(${_imgScale})`;
}
function resetImgZoom(){
  _imgScale=1;
  const img=document.getElementById('imgView');
  if(img) img.style.transform='scale(1)';
}
function closeImgViewer(){
  const el=document.getElementById('imgViewerWrap');
  if(el) el.remove();
  _imgPinch=null;
}

/* 通用工具函数 base64 <-> blob */
function base64ToBlob(b64){
  const [meta,data]=b64.split(',');
  let mime=(meta.match(/:(.*?);/)||['',''])[1]||'';
  // mime 为空/未知时从字节头推断（华为等 WebView 可能返回 data:;base64,xxx）
  if(!mime || mime==='application/octet-stream' || mime==='text/plain'){
    try{
      const head=atob(data.slice(0,8));
      const c0=head.charCodeAt(0), c1=head.charCodeAt(1);
      if(c0===0xFF && c1===0xD8) mime='image/jpeg';
      else if(c0===0x89 && head.slice(1,4)==='PNG') mime='image/png';
      else if(head.slice(0,3)==='GIF') mime='image/gif';
      else if(head.slice(0,4)==='RIFF') mime='image/webp';
      else if(head.slice(0,2)==='BM') mime='image/bmp';
      else mime='application/octet-stream';
    }catch(e){ mime='application/octet-stream'; }
  }
  const bin=atob(data);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
/* base64 dataURL → Blob URL（缓存），避免超长base64内嵌HTML属性被WebView截断导致图片空白 */
/* 顺便补全 mime：华为等 WebView 返回 data:;base64,xxx 时浏览器无法嗅探内容 → 显示占位图，需补成 data:image/jpeg;base64,xxx */
function sniffImageMime(b64){
  try{
    const head=atob(b64.slice(0,8));
    const c0=head.charCodeAt(0), c1=head.charCodeAt(1);
    if(c0===0xFF && c1===0xD8) return 'image/jpeg';
    if(c0===0x89 && head.slice(1,4)==='PNG') return 'image/png';
    if(head.slice(0,3)==='GIF') return 'image/gif';
    if(head.slice(0,4)==='RIFF') return 'image/webp';
    if(head.slice(0,2)==='BM') return 'image/bmp';
  }catch(e){}
  return '';
}
function fixDataUrlMime(dataUrl){
  if(typeof dataUrl!=='string' || !dataUrl.startsWith('data:')) return dataUrl;
  if(!/^data:image\//.test(dataUrl) && dataUrl.indexOf('base64,')>-1){
    const idx=dataUrl.indexOf('base64,');
    const b64=dataUrl.slice(idx+7);
    const mime=sniffImageMime(b64);
    if(mime) return `data:${mime};base64,${b64}`;
  }
  return dataUrl;
}
const _b64UrlCache={};
function b64Url(dataUrl){
  try{
    const fixed=fixDataUrlMime(dataUrl);
    // 小图（<150KB base64）直接用补过 mime 的 dataURL 渲染——最保守，兼容所有 WebView
    // （不依赖 Blob URL / canvas，避免移动端兼容性问题）
    if(typeof fixed==='string' && fixed.length<150*1024) return fixed;
    // 大图才用 Blob URL（避免超长 dataURL 内嵌 HTML 属性被截断）
    if(!_b64UrlCache[fixed]){
      _b64UrlCache[fixed]=URL.createObjectURL(base64ToBlob(fixed));
    }
    return _b64UrlCache[fixed];
  }catch(e){
    return fixDataUrlMime(dataUrl);
  }
}
function fileToBase64(file){
  return new Promise((res, rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('文件读取失败'));
    r.readAsDataURL(file);
  });
}

function getRecentDates(n){
  const arr=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    arr.push(localDateStr(d));
  }
  return arr;
}

function saveRecord(moduleKey,id){
  const isSy = (MODULES.find(m=>m.key===moduleKey)||{}).group==='sy';
  const totalEl=document.getElementById('rc_total');
  const total=totalEl?(parseInt(totalEl.value)||0):0;
  const correctEl=document.getElementById('rc_correct');
  const correct=correctEl?(parseInt(correctEl.value)||0):0;
  const duration=parseInt(document.getElementById('rc_dur').value)||0;
  const book=(document.getElementById('rc_book').value||'').trim();
  const question=(document.getElementById('rc_question').value||'').trim();
  const improve=(document.getElementById('rc_improve').value||'').trim();
  const subEl=document.getElementById('rc_sub');
  const sub=subEl?subEl.value:'';
  const dateEl=document.getElementById('rc_date');
  const date=dateEl&&dateEl.value?dateEl.value:todayStr();
  if(!isSy){
    if(total<=0){ toast('请输入做题数目'); return; }
    if(correct>total){ toast('正确数不能大于总数'); return; }
  }
  if(!isSy && !question && !improve && total<=0){ toast('请填写内容'); return; }
  if(id){
    const r=DB.records.find(r=>r.id===id);
    Object.assign(r,{total,correct,duration,sub,date,book,question,improve,updatedAt:Date.now()});
    syncRecordToMistakes(moduleKey, r);
  }else{
    const nr={id:uid(),module:moduleKey,date,total,correct,duration,sub,book,question,improve,updatedAt:Date.now()};
    DB.records.push(nr);
    syncRecordToMistakes(moduleKey, nr);
  }
  saveDB(); closeModal(); renderStudy(); toast('已保存');
}
/* 把刷题记录的问题+改进方法自动同步到易错考点管理（mistakes 数组，而非 knowledge） */
function syncRecordToMistakes(moduleKey, rec){
  try{
    const mod=MODULES.find(m=>m.key===moduleKey);
    if(!mod) return;
    const question=(rec.question||'').trim();
    const improve=(rec.improve||'').trim();
    if(!improve && !question) return;
    // 易错知识点 = 改进方法（没有改进时退回问题）；备注留空
    const point = improve || question;
    const note = '';
    // 编辑更新：优先找由这条记录产生的考点（recId 关联），更新而不是新建
    const linked=DB.mistakes.find(m=>m.recId===rec.id);
    if(linked){
      linked.module=mod.key;
      linked.sub=rec.sub||''; // v2.2.18：编辑刷题记录换子模块时同步更新考点子模块
      linked.point=point;
      linked.note=note;
      linked.date=rec.date||todayStr();
      linked.updatedAt=Date.now();
      return;
    }
    // 去重：同模块+同内容不重复
    const exist=DB.mistakes.find(m=>m.module===mod.key && m.point===point);
    if(exist) return;
    DB.mistakes.push({id:uid(),module:mod.key,sub:rec.sub||'',point,note,date:rec.date||todayStr(),recId:rec.id,updatedAt:Date.now()});
  }catch(e){ console.warn('syncRecordToMistakes', e); }
}
/* 把错题的知识点自动同步到考点本（mistakes 数组）；带 recId 关联，编辑时更新而非新建 */
function syncErrorToMistakes(err){
  try{
    const modKey=err.module;
    const point=(err.point||'').trim();
    if(!point) return; // 知识点为空不生成考点
    // 编辑更新：优先找由这条错题产生的考点（recId 关联）
    const linked=DB.mistakes.find(m=>m.recId===err.id);
    if(linked){
      linked.module=modKey;
      linked.point=point;
      linked.updatedAt=Date.now();
      return;
    }
    // 去重：同模块 + 知识点首行已存在则不重复
    const exists=DB.mistakes.find(m=>m.module===modKey && (m.point||'').split('\n')[0].trim()===point);
    if(exists) return;
    DB.mistakes.push({id:uid(),module:modKey,sub:err.sub||'',point,note:'',date:err.date||todayStr(),recId:err.id,updatedAt:Date.now()});
  }catch(e){ console.warn('syncErrorToMistakes',e); }
}
/* 一次性把历史上未同步到考点本的错题补同步进来（带 recId 关联 + 去重，已存在不重复） */
function syncAllErrorsToMistakes(){
  if(!DB.errors||!DB.errors.length) return 0;
  let added=0;
  DB.errors.forEach(e=>{
    if(!(e.point&&e.point.trim())) return;
    const before=(DB.mistakes||[]).length;
    syncErrorToMistakes(e);
    if((DB.mistakes||[]).length>before) added++;
  });
  dedupMistakes();
  saveDB();
  return added;
}
/* 补同步按钮用：带提示并刷新弹窗 */
function syncAllErrorsToMistakesAndToast(){
  const n=syncAllErrorsToMistakes();
  toast('已补同步 '+n+' 条未同步错题到考点本');
  mistakeListModal();
}
/* 日期归一化：2026.07.28 / 2026/07/28 / 20260728 → 2026-07-28 */
function normalizeDate(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{4})[.\/年](\d{1,2})[.\/月](\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return s;
}

let mediaRecorder=null, audioChunks=[], recStream=null, recTimer=null, recStart=0, currentRecTarget=null;

function startRec(targetId){
  currentRecTarget=targetId;
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recStream=stream;
    mediaRecorder=new MediaRecorder(stream);
    audioChunks=[];
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=async()=>{
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const b64=await blobToBase64(blob);
      const target=document.getElementById(currentRecTarget);
      if(target){
        target.dataset.audio=b64;
        const status=target.parentNode.querySelector('.rec-status');
        if(status) status.textContent='录音完成（'+Math.round(blob.size/1024)+'KB），可回放';
        toast('录音已保存');
      }
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    recStart=Date.now();
    const btn=document.querySelector('#'+targetId).parentNode.querySelector('.rec-btn');
    if(btn){ btn.classList.add('recording'); btn.textContent='■'; }
    const status=document.querySelector('#'+targetId).parentNode.querySelector('.rec-status');
    if(status) status.textContent='录音中…';
    recTimer=setInterval(()=>{
      const sec=Math.floor((Date.now()-recStart)/1000);
      if(status) status.textContent='录音中… '+sec+'″';
      if(sec>=120) stopRec();
    },200);
  }).catch(err=>{
    toast('无法访问麦克风：'+err.message);
  });
}
function stopRec(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.stop();
  }
  clearInterval(recTimer);
  const btn=document.querySelector('.rec-btn.recording');
  if(btn){ btn.classList.remove('recording'); btn.textContent='●'; }
}
function blobToBase64(blob){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.readAsDataURL(blob);
  });
}
/* 拍照上传（v2.1.8 最简方案：直接 FileReader.readAsDataURL，无 canvas 无 Blob URL） */
async function onPhotoInput(input, targetArr){
  if(targetArr.length){
    for(let i=targetArr.length-1;i>=0;i--){
      if(typeof targetArr[i]!=='string') targetArr.splice(i,1);
    }
  }
  const files=input.files;
  if(!files.length) return;
  let okCount=0, failCount=0;
  for(const f of files){
    if(f.size>10*1024*1024){ toast('图片 '+f.name+' 超过 10MB，无法上传'); failCount++; continue; }
    // 最简方案：直接 FileReader.readAsDataURL 读原图 base64（不经过 canvas）
    let b64;
    try{
      b64=await fileToBase64(f);
    }catch(readErr){
      // FileReader 失败 → ArrayBuffer 兜底
      try{
        const buf=await f.arrayBuffer();
        b64=await blobToBase64(new Blob([buf],{type:f.type||'image/jpeg'}));
      }catch(e){
        console.error('图片读取失败:', f.name, e);
        toast('图片 '+f.name+' 读取失败，请换一张');
        failCount++; continue;
      }
    }
    window._lastPhotoDebug={name:f.name,size:f.size,len:typeof b64==='string'?b64.length:0,
      head:typeof b64==='string'?b64.slice(0,40):String(b64),type:f.type||''};
    if(typeof b64==='string' && b64.length>100){
      targetArr.push(b64);
      okCount++;
    }else{
      toast('图片 '+f.name+' 读取失败，请换一张');
      failCount++;
    }
  }
  if(input.dataset.render) window[input.dataset.render]();
  input.value='';
  if(okCount>0 && failCount===0) toast('已添加 '+okCount+' 张图片');
}
function compressImage(file, maxSize, quality){
  return new Promise((res, rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('文件读取失败（建议尝试其他图片）'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('图片解码失败（可能是 HEIC/AVIF 等系统不支持的格式，建议先用手机相册"导出为JPEG"再上传）'));
      img.onload=()=>{
        try{
          // 用 naturalWidth/Height（不是 width/height），更可靠
          let w=img.naturalWidth, h=img.naturalHeight;
          if(!w || !h){ rej(new Error('图片尺寸为空')); return; }
          if(w>maxSize||h>maxSize){ if(w>=h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;} }
          const c=document.createElement('canvas');
          c.width=w; c.height=h;
          const ctx=c.getContext('2d');
          // 白色背景（防止透明 PNG 转 JPEG 时变黑）
          ctx.fillStyle='#fff';
          ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          let b64;
          try{ b64=c.toDataURL('image/jpeg', quality); }
          catch(canvasErr){
            rej(new Error('canvas 跨域污染或编码失败'));
            return;
          }
          // 严格校验：必须是合法图片 data URL 且有实际数据
          if(!b64 || typeof b64!=='string' || !b64.startsWith('data:image/') || b64.length<300){
            rej(new Error('压缩后格式异常（图片可能已损坏或为空，建议重选或换张图）'));
            return;
          }
          if(b64.length>1024*1024){ toast('图片压缩后仍较大('+Math.round(b64.length/1024)+'KB)，建议选更小的图'); }
          res(b64);
        }catch(e){ rej(e); }
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* 错题已掌握/待复习后 → 自动打开下一条待复习错题（跳到当前题的下一题，不回第一条） */
function nextErrorDetail(currentId){
  const today=todayStr();
  // 用完整列表找当前位置（当前题已被标记掌握，不在待复习列表中了）
  let fullList = [...DB.errors].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  // 如果有模块筛选，应用筛选
  if(ebbErrFilter) fullList = fullList.filter(e=>e.module===ebbErrFilter);
  const currentIdx = currentId ? fullList.findIndex(e=>e.id===currentId) : -1;
  // 从当前位置往后找下一个待复习的
  if(currentIdx >= 0){
    for(let i = currentIdx + 1; i < fullList.length; i++){
      const st = getErrorEbb(fullList[i]);
      if(!st.done && st.next <= today){
        viewErrorDetail(fullList[i].id);
        return;
      }
    }
    // 往后没找到，从头绕回找
    for(let i = 0; i < currentIdx; i++){
      const st = getErrorEbb(fullList[i]);
      if(!st.done && st.next <= today){
        viewErrorDetail(fullList[i].id);
        return;
      }
    }
  }
  // 兜底：任意待复习的第一条
  const dueList = DB.errors.filter(x=>{const st=getErrorEbb(x); return !st.done && st.next<=today;});
  if(dueList.length){ viewErrorDetail(dueList[0].id); }
  else{ closeModal(); renderPage(currentPageName()); toast('🎉 今日错题复习完成！'); }
}
/* 从错题详情返回：如果是从列表进入的，回到对应列表（而不是退出到页面） */

function backFromErrorDetail(){
  const fn=_detailReturnFn;
  closeModal();

function delErrorFromDetail(id){
  if(!confirm('删除此错题？')) return;
  // 先找到当前列表中下一条错题（删除前查找，避免删除后找不到位置）
  const today=todayStr();
  const fn=_detailReturnFn;
  const list = fn==='showAllErrorEbb'
    ? DB.errors.filter(e=>{const st=getErrorEbb(e); return !st.done && st.next<=today;})
    : [...DB.errors].sort((a,b)=>b.date.localeCompare(a.date));
  const idx = list.findIndex(e=>e.id===id);
  const nextItem = list[idx+1] || list[idx-1];
  
  markDeleted('errors', id);
  DB.errors=DB.errors.filter(e=>e.id!==id);
  if(DB.errorEbb) delete DB.errorEbb[id];
  saveDB();
  
  if(nextItem){ viewErrorDetail(nextItem.id); } // openModal不清理跟踪变量，下一条详情的返回仍有效
  else if(fn){ closeModal(); setTimeout(()=>window[fn](),50); } // 没有下一条，回列表
  else{ closeModal(); renderPage(currentPageName()); }
}

/* Excel批量导入错题（支持覆盖模式） */
async function importErrorExcel(input){
  const file=input.files[0];
  if(!file) return;
  toast('正在解析Excel...');
  try{
    if(!window.XLSX){
      await loadScript('https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    }
    const arrayBuffer=await file.arrayBuffer();
    const wb=XLSX.read(arrayBuffer,{type:'array'});
    let imported=0;
    // 覆盖模式：清空现有错题再导入
    const overwriteEl=document.getElementById('er_overwrite');
    const overwrite=!!(overwriteEl&&overwriteEl.checked);
    if(overwrite){ DB.errors=[]; DB.errorEbb={}; }
    // 模块名→key 映射（含子模块名）
    const modMap={};
    MODULES.forEach(m=>{
      modMap[m.name]=m.key;
      (m.subs||[]).forEach(s=>{ modMap[s]=m.key; });
    });
    // 模块列名 → 子模块名 别名映射（如用户写"逻辑判断"实际想归到子模块"逻辑推理"）
    const SUB_ALIAS={
      '逻辑判断':'逻辑推理',
    };
    // 尝试提取xlsx中的嵌入图片（按sheet分组）+ WPS cellimages顺序图片
    const sheetImages=await extractXlsxImages(arrayBuffer, wb.SheetNames).catch(()=>{
      const obj={};
      wb.SheetNames.forEach(sn=>{ obj[sn]=[]; });
      return obj;
    });
    const cellImgs=sheetImages._cellImages||[];
    delete sheetImages._cellImages;
    let cellIdx=0;
    wb.SheetNames.forEach(sn=>{
      const ws=wb.Sheets[sn];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      rows.forEach((r,idx)=>{
        // 智能匹配列名
        const getVal=(keys)=>{ for(const k of keys){ for(const rk in r){ if(rk.includes(k)) return String(r[rk]||'').trim(); } } return ''; };
        const desc=getVal(['题目摘要','题目','题干','摘要']);
        const myAns=getVal(['我的答案','你答','考生答案']);
        const correctAns=getVal(['正确答案','正解','答案']);
        const reason=getVal(['错误原因','错因','原因']);
        const tags=getVal(['知识点标签','知识点','标签']);
        const review=getVal(['复习提醒','提醒']);
        const dateStr=getVal(['日期']);
        const modName=getVal(['模块','题型分类']);
        const questionNo=getVal(['题号']);
        const pageRef=getVal(['页数']);
        const status=getVal(['状态']);
        if(!desc&&!correctAns) return; // 跳过空行
        // 模块映射
        let moduleKey='';
        let sub='';
        if(modName && modMap[modName]){
          moduleKey=modMap[modName];
          MODULES.forEach(mm=>{ if(mm.subs&&mm.subs.includes(modName)) sub=modName; });
        }else if(modMap[sn]){
          moduleKey=modMap[sn]; // 用Sheet名匹配
          MODULES.forEach(mm=>{ if(mm.subs&&mm.subs.includes(sn)) sub=sn; });
        }else{
          // 模糊匹配
          for(const k in modMap){
            if(modName&&modName.includes(k)){
              moduleKey=modMap[k];
              MODULES.forEach(mm=>{ if(mm.subs&&mm.subs.includes(k)) sub=k; });
              break;
            }
          }
        }
        if(!moduleKey) moduleKey='pd'; // 默认判断推理
        // 别名映射（如"逻辑判断"→"逻辑推理"）
        if(moduleKey==='pd' && !sub && modName && SUB_ALIAS[modName]){
          sub = SUB_ALIAS[modName];
        }
        // 组装内容
        let fullDesc=desc;
        if(questionNo) fullDesc='【'+questionNo+(pageRef?' '+pageRef:'')+'】'+desc;
        const point=[tags,reason].filter(Boolean).join('；');
        const fullPoint=[point,review].filter(Boolean).join('\n复习提醒：');
        const fullAnswer=correctAns+(myAns?('（你选'+myAns+'）'):'');
        // 日期：表格日期列（支持Date对象/字符串/序列号），无则用当天
        const date=parseFlexDate(dateStr)||todayStr();
        // 去重：同日期同题目不重复导入
        const exists=DB.errors.some(e=>e.date===date&&e.desc===fullDesc);
        if(exists) return;
        // 该行截图：图片锚点row = 数据行索引+1；缺图时用cellimages顺序图补充
        let rowImgs=(sheetImages[sn]||[]).filter(img=>img.row===idx+1).map(img=>img.dataUrl);
        if(!rowImgs.length && cellIdx<cellImgs.length){
          rowImgs=[cellImgs[cellIdx]];
          cellIdx++;
        }
        DB.errors.push({
          id:uid(), module:moduleKey, sub, date,
          desc:fullDesc, answer:fullAnswer, point:fullPoint,
          photos:rowImgs, // 该行对应的截图
          audio:'', audioText:'',
          _status:status||'',
          updatedAt:Date.now(),
        });
        imported++;
      });
    });
    saveDB();
    closeModal();
    renderPage(currentPageName());
    // 统计实际导入的截图数（含cellimages补充）
    const imgCount=DB.errors.reduce((s,e)=>s+(e.photos||[]).length,0);
    toast(imgCount>0 ? (overwrite?`已覆盖导入${imported}条错题（含${imgCount}张截图）`:`已导入${imported}条错题（含${imgCount}张截图）`) : (overwrite?`已覆盖导入${imported}条错题`:`已导入${imported}条错题`));
  }catch(err){
    toast('解析失败：'+err.message);
    console.error(err);
  }
}

      '定义判断刷题记录':{key:'pd',sub:'定义判断'},
      '类比推理刷题记录':{key:'pd',sub:'类比推理'},
      '资料分析刷题记录':{key:'zl',sub:''},
      '数量关系刷题记录':{key:'sl',sub:''},
      '常识判断刷题记录':{key:'cs',sub:''},
      '政治理论刷题记录':{key:'zzll',sub:''},
    };
    let totalRec=0, totalKnow=0;
    const added=new Set();
    wb.SheetNames.forEach(sn=>{
      const cfg=SHEET_MOD[sn.trim()];
      if(!cfg) return; // 跳过"刷题进度"等无关表
      const ws=wb.Sheets[sn];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      // 找表头行：包含"日期"和"正确数量"
      let headIdx=-1;
      for(let i=0;i<rows.length;i++){
        const row=rows[i];
        if(row.some(c=>String(c).includes('日期')) && row.some(c=>String(c).includes('正确数量'))){
          headIdx=i; break;
        }
      }
      if(headIdx<0) return;
      const head=rows[headIdx].map(c=>String(c||'').trim());
      const colOf=(keyArr)=>{
        for(let c=0;c<head.length;c++){
          if(keyArr.some(k=>head[c].includes(k))) return c;
        }
        return -1;
      };
      const cDate=colOf(['日期']);
      const cPoint=colOf(['知识点','试卷类型','题本']);
      const cCorrect=colOf(['正确数量']);
      const cTotal=colOf(['题目总数']);
      const cDur=colOf(['用时']);
      const cQuestion=colOf(['问题']);
      const cImprove=colOf(['改进方法']);
      // 题本名：表头前可能有"题本名"行（第4行A列）
      let book='';
      for(let i=headIdx-2;i>=0;i--){
        const v=String(rows[i][0]||'').trim();
        if(v && !/^(序号|题本|成绩记录|日期)$/.test(v)){ book=v; break; }
      }
      // 逐行解析；日期为空的行是上一行"问题/改进"的延续（合并）
      let cur=null;
      const commit=()=>{
        if(!cur) return;
        const date=normalizeDate(cur.date);
        if(!date) return;
        cur.date=date;
        const duration=cur.dur?parseInt(String(cur.dur).replace(/[^\d]/g,''))||0:0;
        const correct=cur.correct?Math.round(parseFloat(cur.correct)):0;
        const total=cur.total?Math.round(parseFloat(cur.total)):0;
        const question=(cur.question||'').trim();
        const improve=(cur.improve||'').trim();
        const key=cfg.key+'|'+cur.date+'|'+total+'|'+correct+'|'+duration+'|'+question.slice(0,30);
        if(added.has(key)) return;
        added.add(key);
        const recId=uid();
        DB.records.push({id:recId,module:cfg.key,date:cur.date,total,correct,duration,sub:cfg.sub,book:cur.book||book,question,improve});
        totalRec++;
        // 同步到易错考点（mistakes，非 knowledge；带 recId 关联，编辑记录时更新而非新建）
        // 易错知识点 = 改进方法（没有改进时退回问题）；备注留空
        const content = improve || question;
        if(content){
          const mod=MODULES.find(m=>m.key===cfg.key);
          const exist=DB.mistakes.find(k=>k.module===(mod?mod.key:'')&&k.point===content);
          if(!exist){
            DB.mistakes.push({id:uid(),module:mod?mod.key:'',point:content,note:'',date:cur.date,recId,updatedAt:Date.now()});
            totalKnow++;
          }
        }
        cur=null;
      };
      for(let i=headIdx+1;i<rows.length;i++){
        const row=rows[i];
        const dateRaw=String(cDate>=0?row[cDate]||'':'').trim();
        if(dateRaw && /20\d{2}/.test(dateRaw)){
          // 新记录行
          commit();
          cur={ date: normalizeDate(dateRaw), point: String(cPoint>=0?row[cPoint]||'':'').trim(), correct: row[cCorrect>=0?cCorrect:-1]??'', total: row[cTotal>=0?cTotal:-1]??'', dur: row[cDur>=0?cDur:-1]??'', question: row[cQuestion>=0?cQuestion:-1]??'', improve: row[cImprove>=0?cImprove:-1]??'', book: (cfg.key==='zl'?(cPoint>=0?String(row[cPoint]||'').trim():''):'') };
        }else if(cur){
          // 延续行：合并问题/改进
          if(cQuestion>=0 && String(row[cQuestion]||'').trim()) cur.question += '\n'+String(row[cQuestion]).trim();
          if(cImprove>=0 && String(row[cImprove]||'').trim()) cur.improve += '\n'+String(row[cImprove]).trim();
        }
      }
      commit();
    });
    if(totalRec===0){ toast('未识别到刷题数据，请确认表格格式'); return; }
    saveDB();
    toast('已导入 '+totalRec+' 条刷题记录，同步 '+totalKnow+' 条知识点');
    renderStudy();
    input.value='';
  }catch(err){
    toast('解析失败：'+err.message);
    console.error(err);
  }
}

async function loadXlsxLib(){
  if(window.XLSX) return true;
  const urls=[
    'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  for(const u of urls){
    try{ await loadScript(u); if(window.XLSX) return true; }catch(e){}
  }
  return !!window.XLSX;
}
/* 兼容移动浏览器的下载（与下载页一致的方式） */
function downloadBlob(filename, blob){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},2500);
    return true;
  }catch(e){ return false; }
}

/* 从xlsx中提取嵌入图片（按行分配+压缩）。
   返回 {sheetName: [{row:行号, dataUrl}, ...]} */
async function extractXlsxImages(arrayBuffer, sheetNames){
  if(typeof JSZip==='undefined'){
    try{ await loadScript('https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js'); }catch(e){ return {}; }
  }
  try{
    const zip = await JSZip.loadAsync(arrayBuffer);
    // 收集所有媒体图片并压缩
    const media={}; // 文件名→{dataUrl}
    const tasks=[];
    Object.keys(zip.files).forEach(f=>{
      if(/^xl\/media\//.test(f) && !zip.files[f].dir){
        tasks.push((async()=>{
          const ext=(f.split('.').pop()||'png').toLowerCase();
          const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',bmp:'image/bmp',webp:'image/webp'}[ext]||'image/png';
          const data=await zip.files[f].async('base64');
          media[f]=await compressImage(`data:${mime};base64,${data}`, 1080, 0.85);
        })());
      }
    });
    await Promise.all(tasks);
    if(!Object.keys(media).length) return sheetNames.reduce((o,n)=>(o[n]=[],o),{});
    // 按drawing关系分配图片到具体sheet+行
    const mapped=await mapImagesToSheets(zip, sheetNames, media);
    // 解析WPS cellimages.xml（无行列信息，按顺序返回）
    const cellImgs=await extractCellImages(zip, media);
    let result;
    if(mapped){
      result=mapped;
    }else{
      // 降级：所有图片按序号平铺（第i张→第i+1行）
      const allImgs=Object.values(media);
      result={};
      sheetNames.forEach(sn=>{
        result[sn]=allImgs.map((u,i)=>({row:i+1, dataUrl:u}));
      });
    }
    result._cellImages=cellImgs;
    return result;
  }catch(e){
    return sheetNames.reduce((o,n)=>(o[n]=[],o),{});
  }
}
/* 解析WPS的cellimages.xml：单元格内嵌图片，无行列信息，按文件顺序返回dataURL数组 */
async function extractCellImages(zip, media){
  try{
    const ciFile=zip.file('xl/cellimages.xml');
    if(!ciFile) return [];
    const ciText=await ciFile.async('string');
    const relsFile=zip.file('xl/_rels/cellimages.xml.rels');
    if(!relsFile) return [];
    const relsDoc=new DOMParser().parseFromString(await relsFile.async('string'),'text/xml');
    const ridToTarget={};
    Array.from(relsDoc.getElementsByTagName('Relationship')).forEach(r=>{
      ridToTarget[r.getAttribute('Id')]=(r.getAttribute('Target')||'');
    });
    const imgs=[];
    const re=/r:embed="(rId\d+)"/g;
    let m;
    const seen=new Set();
    while((m=re.exec(ciText))){
      const t=ridToTarget[m[1]];
      if(!t||!t.includes('media/')) continue;
      const imgPath='xl/'+t.replace(/^\.\.\//,'');
      const imgKey=Object.keys(media).find(k=>k===imgPath||k.endsWith(t.split('/').pop()));
      if(imgKey && !seen.has(imgKey)){
        seen.add(imgKey);
        imgs.push(media[imgKey]);
      }
    }
    return imgs;
  }catch(e){
    return [];
  }
}
/* 图片压缩：canvas降采样，避免localStorage超限 */
function compressImage(dataUrl, maxSize, quality){
  return new Promise(resolve=>{
    try{
      const img=new Image();
      img.onload=()=>{
        try{
          const scale=Math.min(1, maxSize/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*scale));
          const h=Math.max(1,Math.round(img.height*scale));
          const canvas=document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror=()=>resolve(dataUrl);
      img.src=dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
/* 通过zip关系文件把图片分配到具体sheet和行。失败返回null降级处理。 */
async function mapImagesToSheets(zip, sheetNames, media){
  try{
    const REL_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    // 1. workbook.xml.rels：rId → sheet文件
    const wbRelsDoc=new DOMParser().parseFromString(await zip.file('xl/_rels/workbook.xml.rels').async('string'),'text/xml');
    const sheetRidMap={};
    Array.from(wbRelsDoc.getElementsByTagName('Relationship')).forEach(r=>{
      const target=r.getAttribute('Target')||'';
      if(target.includes('worksheets/sheet')&&target.endsWith('.xml')){
        sheetRidMap[r.getAttribute('Id')]='xl/'+target;
      }
    });
    // 2. workbook.xml：sheet名 → rId
    const wbDoc=new DOMParser().parseFromString(await zip.file('xl/workbook.xml').async('string'),'text/xml');
    const nameToRid={};
    Array.from(wbDoc.getElementsByTagName('sheet')).forEach(s=>{
      nameToRid[s.getAttribute('name')]=s.getAttributeNS(REL_NS,'id')||s.getAttribute('r:id');
    });
    // 3. 每个sheet：sheet文件rels → drawing → 图片(带行号)
    const result={};
    sheetNames.forEach(sn=>{ result[sn]=[]; });
    for(const sn of sheetNames){
      const sheetFile=sheetRidMap[nameToRid[sn]];
      if(!sheetFile) continue;
      const sheetRelsFile=zip.file(sheetFile.replace(/worksheets\/([^/]+)$/,'worksheets/_rels/$1.rels'));
      if(!sheetRelsFile) continue;
      const sheetRelsDoc=new DOMParser().parseFromString(await sheetRelsFile.async('string'),'text/xml');
      const drawingTargets=Array.from(sheetRelsDoc.getElementsByTagName('Relationship'))
        .map(r=>(r.getAttribute('Target')||''))
        .filter(t=>t.includes('drawing'));
      for(const dt of drawingTargets){
        const drawingFile=dt.startsWith('/')?'xl'+dt:('xl/'+dt.replace(/^\.\.\//,''));
        const dRelsFile=zip.file(drawingFile.replace('/drawings/','/drawings/_rels/')+'.rels');
        if(!dRelsFile) continue;
        const dRelsDoc=new DOMParser().parseFromString(await dRelsFile.async('string'),'text/xml');
        // drawing.xml 解析锚点：from/row + blip embed（带xdr:前缀，用正则解析）
        const drawingText=await zip.file(drawingFile).async('string');
        const relMap={};
        Array.from(dRelsDoc.getElementsByTagName('Relationship')).forEach(r=>{
          const t=r.getAttribute('Target')||'';
          if(t.includes('media/')) relMap[r.getAttribute('Id')]=t;
        });
        const anchorRe=/<xdr:twoCellAnchor[\s\S]*?<\/xdr:twoCellAnchor>/g;
        let am;
        while((am=anchorRe.exec(drawingText))){
          const block=am[0];
          const rowM=block.match(/<xdr:from>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/);
          const embedM=block.match(/r:embed="(rId\d+)"/);
          if(!rowM||!embedM) continue;
          const rowVal=parseInt(rowM[1]);
          const t=relMap[embedM[1]];
          if(!t) continue;
          const imgPath='xl/'+t.replace(/^\.\.\//,'');
          const imgKey=Object.keys(media).find(k=>k===imgPath||k.endsWith(t.split('/').pop()));
          if(imgKey) result[sn].push({row:rowVal, dataUrl:media[imgKey]});
        }
      }
    }
    return result;
  }catch(e){
    console.warn('mapImagesToSheets失败，降级:',e.message);
    return null;
  }
}
