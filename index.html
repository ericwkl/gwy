/* 同步前瘦身：把错题/复盘中 >300KB 的截图 base64 上传到 Supabase Storage（原图不压缩），
   数据库只存图片链接，避免整库超出 PostgREST 请求体上限；小图直接保留 base64 */
async function slimForSync(){
  const clone = JSON.parse(JSON.stringify(DB));
  // accuHtmlCache 是本地渲染缓存，不同步到云端（防止其他设备收到过时缓存）
  delete clone.accuHtmlCache;
  const tasks = [];
  (clone.errors || []).forEach(e => { (e.photos || []).forEach((p, i) => { if(typeof p === 'string' && p.startsWith('data:') && p.length > 300 * 1024) tasks.push({ arr: e.photos, i, p }); }); });
  (clone.reviews || []).forEach(r => { (r.photos || []).forEach((p, i) => { if(typeof p === 'string' && p.startsWith('data:') && p.length > 300 * 1024) tasks.push({ arr: r.photos, i, p }); }); });
  if(!tasks.length) return clone;
  for(const t of tasks.slice(0, 12)){
    try{
      const u = await uploadPhotoToStorage(t.p);
      if(u && u !== t.p) t.arr[t.i] = u;
    }catch(e){}
  }
  return clone;
}
/* 图片上传到 Supabase Storage（bucket: wb_images，public）。成功返回公网 URL，失败返回原 dataURL */
async function uploadPhotoToStorage(dataUrl){
  try{
    if(!supabaseClient) return dataUrl;
    const blobResp = await fetch(dataUrl);
    const blob = await blobResp.blob();
    if(!blob || !blob.size) return dataUrl;
    const ext = blob.type==='image/png' ? 'png' : blob.type==='image/webp' ? 'webp' : blob.type==='image/gif' ? 'gif' : 'jpg';
    const path = 'photos/' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const { error } = await supabaseClient.storage.from('wb_images').upload(path, blob, { contentType: blob.type || 'image/jpeg', upsert: true });
    if(error) throw error;
    const { data: pub } = supabaseClient.storage.from('wb_images').getPublicUrl(path);
    return pub && pub.publicUrl ? pub.publicUrl : dataUrl;
  }catch(e){ return dataUrl; }
}
/* 保存前把大图（>150KB base64）上传 Storage，返回 photos（大图=URL，小图=base64） */
async function ensurePhotosCloud(photos){
  const out = [];
  for(const p of photos || []){
    if(typeof p === 'string' && p.startsWith('data:') && p.length > 150 * 1024){
      out.push(await uploadPhotoToStorage(p));
    }else{
      out.push(p);
    }
  }
  return out;
}
/* 推送本地数据到云端（upsert 整库；自动压缩大图片避免 Supabase 请求体超限） */
async function syncPush(){
  if(!supabaseClient || _syncPushing) return;
  // 空数据保护：本地关键字段全空时绝不推送（防止新设备/缓存被清时用空数据覆盖云端）
  // v2.1.81 修复 SYNC-001：补充 reviews 和 studyProgress 检查
  const dbd = DB || {};
  const isEmptyLocal = !(dbd.exams||[]).length && !(dbd.records||[]).length && !(dbd.errors||[]).length
    && !(dbd.weekTasks||[]).length && !(dbd.mistakes||[]).length && !(dbd.knowledge||[]).length && !(dbd.papers||[]).length
    && !(dbd.reviews||[]).length && !(dbd.studyProgress||[]).length;
  if(isEmptyLocal){ setSyncState('connected'); return; }
  _syncPushing = true;
  try{
    setSyncState('syncing');
    const payload = await slimForSync();
    const { error } = await supabaseClient
      .from('workbench_sync')
      .upsert({ user_key: getSyncKey(), data: payload, updated_at: new Date().toISOString(), device: getDeviceId() }, { onConflict: 'user_key' });
    if(error) throw error;
    DB.settings.lastSyncTime = new Date().toLocaleString('zh-CN');
    DB.settings.lastSyncTimeTs = Date.now(); // v2.1.81 SYNC-002: 记录推送时间戳供轮询比较
    // 直接写 localStorage，避免 saveDB 再次触发推送（防循环）
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    setSyncState('connected');
    updateSyncBadge();
  }catch(e){
    setSyncState('error');
    console.warn('[Supabase push]', e && e.message);
  }finally{
    _syncPushing = false;
  }
}
/* 拉取云端并合并：比较 updated_at，云端更新则覆盖本地，否则推送本地 */

/* 合并本地与云端数据：全字段保留（数组=并集、对象=键合并、标量=云端补空）→ 任何字段都不丢
   v2.1.80 墓碑：合并前先从本地+云端剔除 deletedIds 里标记删除的记录，
   ——这样"删除"能同步到所有设备，不会因其他设备残留旧数据又被合并回来 */
function mergeLocalCloud(local, cloud){
  const merged = JSON.parse(JSON.stringify(local));
  const c = JSON.parse(JSON.stringify(cloud || {}));
  // 墓碑合并：收集本地+云端所有已删除 id
  const tombstones = {};
  const collectTomb = (d) => {
    if(!d || typeof d !== 'object') return;
    for(const m of Object.keys(d)){
      if(!Array.isArray(d[m])) continue;
      if(!tombstones[m]) tombstones[m] = new Set();
      d[m].forEach(id => { if(id) tombstones[m].add(id); });
    }
  };
  collectTomb(local.deletedIds);
  collectTomb(c.deletedIds);
  // 从本地数据剔除已删除记录
  for(const m of Object.keys(tombstones)){
    const ids = tombstones[m];
    if(Array.isArray(merged[m])) merged[m] = merged[m].filter(x => !(x && x.id && ids.has(x.id)));
  }
  // 从云端数据剔除已删除记录（避免被 mergeById 并集回来）
  for(const m of Object.keys(tombstones)){
    const ids = tombstones[m];
    if(Array.isArray(c[m])) c[m] = c[m].filter(x => !(x && x.id && ids.has(x.id)));
  }
  // 合并后的墓碑并集写回（保证每台设备都记住所有删除记录）
  // v2.1.81 SYNC-007 修复：墓碑数组限制每模块最多 500 条，超出按 FIFO 淘汰最旧的
  // 无法安全判断"所有设备都已同步删除"，因此采用上限保护而非主动清理
  merged.deletedIds = {};
  for(const m of Object.keys(tombstones)){
    const ids = [...tombstones[m]];
    merged.deletedIds[m] = ids.length > 500 ? ids.slice(-500) : ids;
  }
  // 正文合并
  for(const k of Object.keys(c)){
    const b = c[k];
    if(b === null || b === undefined) continue;
    // accuHtmlCache 是本地渲染缓存，不从云端合并（防止过时缓存覆盖本地）
    if(k === 'accuHtmlCache') continue;
    if(k === 'mistakeEbb' || k === 'errorEbb'){
      // 艾宾浩斯复习状态：取 stage 大者（已掌握更多轮优先），同 stage 取 next 更晚者
      // 同时剔除墓碑 id 对应的状态（删除错题/考点后复习状态也同步清除，防止复活）
      const ebbModule = k === 'mistakeEbb' ? 'mistakes' : 'errors';
      const tombIds = tombstones[ebbModule];
      if(tombIds && tombIds.size){
        const mClean = {};
        for(const id of Object.keys(merged[k]||{})){ if(!tombIds.has(id)) mClean[id] = merged[k][id]; }
        const bClean = {};
        for(const id of Object.keys(b)){ if(!tombIds.has(id)) bClean[id] = b[id]; }
        merged[k] = mergeEbbMap(mClean, bClean);
      }else{
        merged[k] = mergeEbbMap(merged[k], b);
      }
    }else if(k === 'weekTasks'){
      // 周计划：并集，且 done=true（已勾选）优先
      merged[k] = mergeWeekTasks(Array.isArray(merged[k])?merged[k]:[], b);
    }else if(Array.isArray(b)){
      // 数组字段：并集（id 去重）
      if(k === 'kbCats'){
        // 分类是字符串数组（无 id），必须按值并集去重——否则会被 mergeById 当作无 id 对象全部丢弃（v2.1.80 修复）
        const s = new Set((Array.isArray(merged[k])?merged[k]:[]).concat(b));
        merged[k] = [...s];
      }else{
        merged[k] = mergeById(Array.isArray(merged[k])?merged[k]:[], b);
      }
    }else if(typeof b === 'object'){
      // 对象字段（sportCheckins/tomatoModStats/studyCheckins 等）：键合并，云端+本地都有保留
      merged[k] = { ...b, ...((merged[k] && typeof merged[k]==='object')?merged[k]:{}) };
    }else if(merged[k] === undefined || merged[k] === null){
      // 标量：本地没有时用云端
      merged[k] = b;
    }
  }
  // settings 合并（v2.1.81 SYNC-005 修复）：字段级合并，云端有值且本地为空时用云端
  const ls = local.settings||{}, cs = c.settings||{};
  const mergedSettings = { ...cs, ...ls }; // 先以本地为基础
  // 遍历云端 settings，补充本地缺失的字段
  for(const k of Object.keys(cs)){
    const lv = ls[k], cv = cs[k];
    const lvEmpty = lv === undefined || lv === null || lv === '' || (Array.isArray(lv) && !lv.length) || (typeof lv === 'object' && lv !== null && !Object.keys(lv).length);
    if(lvEmpty && cv !== undefined && cv !== null){
      mergedSettings[k] = cv; // 本地为空但云端有值 → 用云端
    }
  }
  // 嵌套对象（如 supabase 配置）也要字段级合并
  if(cs.supabase && ls.supabase && typeof cs.supabase === 'object' && typeof ls.supabase === 'object'){
    mergedSettings.supabase = { ...cs.supabase };
    for(const k of Object.keys(ls.supabase)){
      if(ls.supabase[k] !== undefined && ls.supabase[k] !== null && ls.supabase[k] !== ''){
        mergedSettings.supabase[k] = ls.supabase[k];
      }
    }
  }
  mergedSettings.lastModified = Math.max(ls.lastModified||0, cs.lastModified||0);
  if(ls.lastSyncTimeTs) mergedSettings.lastSyncTimeTs = ls.lastSyncTimeTs;
  // lastWeekMonday：取最新值（字符串日期比较），防止手机旧值覆盖平板新值导致误重置
  if(cs.lastWeekMonday && ls.lastWeekMonday){
    mergedSettings.lastWeekMonday = cs.lastWeekMonday > ls.lastWeekMonday ? cs.lastWeekMonday : ls.lastWeekMonday;
  }
  merged.settings = mergedSettings;
  return merged;
}

/* 艾宾浩斯状态合并：每 id 取 stage 大者（掌握轮次多优先），同 stage 取 next 更晚（已排到更后复习）者 */
function mergeEbbMap(a, b){
  const out = {};
  const ids = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
  for(const id of ids){
    const x = (a||{})[id], y = (b||{})[id];
    if(!x){ out[id]=y; continue; }
    if(!y){ out[id]=x; continue; }
    const sx = x.stage||0, sy = y.stage||0;
    if(sy !== sx){ out[id] = sy > sx ? y : x; }
    else if(!!y.done !== !!x.done){ out[id] = y.done ? y : x; }
    else{ out[id] = String(y.next||'') >= String(x.next||'') ? y : x; }
  }
  return out;
}
/* 周计划合并（v2.1.81 SYNC-004 修复）：同 id 用 mergeObjFields 做时间戳级合并
   时间戳已有（weekTasks 的增改都设了 updatedAt），之前没用到 */
function mergeWeekTasks(a, b){
  const map = new Map();
  (a||[]).forEach(x=>{ if(x&&x.id) map.set(x.id, x); });
  (b||[]).forEach(x=>{
    if(x&&x.id){
      const cur = map.get(x.id);
      if(!cur){ map.set(x.id, x); }
      else map.set(x.id, mergeObjFields(cur, x)); // v2.1.81: 改为字段级时间戳合并
    }
  });
  return [...map.values()];
}

function mergeById(a, b){
  const map = new Map();
  (a||[]).forEach(x=>{ if(x&&x.id) map.set(x.id, x); });
  (b||[]).forEach(x=>{
    if(x&&x.id){
      const cur = map.get(x.id);
      if(!cur) map.set(x.id, x);
      else map.set(x.id, mergeObjFields(cur, x)); // 同 id：本地空字段用云端补（问题/改进等不丢）
    }
  });
  return [...map.values()];
}
/* 同 id 记录字段级合并（v2.1.81 修复 SYNC-008/009）：
   优先按记录级 updatedAt 判断——谁最新保存，内容以谁为准（改长改短都生效），
   且不丢对方有而自己没有的字段；photos 始终并集去重。
   v2.1.81 SYNC-009 修复：cloudNewer 时改为逐字段非空覆盖，不全量替换
   v2.1.81 SYNC-008 修复：空值判断移除 c === 0
   存量旧数据（两边都无 updatedAt）回退到"谁更长用谁"，防丢内容 */
function mergeObjFields(cur, x){
  const tu = cur.updatedAt || 0, tv = x.updatedAt || 0;
  const cloudNewer = !!(tv && (!tu || tv > tu));       // 云端有时间戳且比本地新（或本地无时间戳）→ 云端为准
  const localNewer = !!(tu && (!tv || tu > tv));    // 本地有时间戳且比云端新（或云端没有时间戳）→ 本地为准
  const bothOld = !tu && !tv;                        // 两边都是存量旧数据（无时间戳）
  const out = { ...cur };
  const CONTENT_FIELDS = ['question','improve','book','point','duration','desc','answer','reason','note','content','feishuUrl','text'];
  for(const k of Object.keys(x)){
    if(k === 'id' || k === 'updatedAt') continue;
    const v = x[k], c = out[k];
    if(k === 'photos' && Array.isArray(v) && v.length){
      // 图片：并集去重，任何设备上传的图都保留
      const curArr = Array.isArray(c) ? c.slice() : [];
      const seen = new Set(curArr);
      v.forEach(p => { if(p && !seen.has(p)){ seen.add(p); curArr.push(p); } });
      out[k] = curArr;
      continue;
    }
    if(cloudNewer){
      // 云端较新：逐字段非空覆盖——云端有值覆盖本地，云端空值不覆盖本地有值
      const cloudNotEmpty = v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && !v.length) && !(typeof v === 'object' && v !== null && !Object.keys(v).length);
      if(cloudNotEmpty || c === undefined || c === null || c === ''){
        out[k] = v;
      }
      continue;
    }
    if(localNewer){
      // 本地较新（包括本地有时间戳但云端没有的情况）：本地有值保留本地，本地为空用云端补
      // 不走 bothOld 的"谁长用谁"逻辑，确保本地编辑不被云端旧数据覆盖
      const empty = c === undefined || c === null || c === '' || (Array.isArray(c) && !c.length) || (typeof c === 'object' && c !== null && !Object.keys(c).length);
      if(empty) out[k] = v;
      continue;
    }
    if(bothOld && CONTENT_FIELDS.includes(k)){
      // 两边都是存量旧数据（都无时间戳）：谁更长更完整用谁，防丢
      const vv = (v === undefined || v === null) ? '' : String(v);
      const cc = (c === undefined || c === null) ? '' : String(c);
      if(!cc){ out[k] = v; }
      else if(vv && vv.length > cc.length){ out[k] = v; }
      continue;
    }
    // 默认：本地有值保留本地，本地为空用云端补
    const empty = c === undefined || c === null || c === '' || (Array.isArray(c) && !c.length) || (typeof c === 'object' && c !== null && !Object.keys(c).length);
    if(empty) out[k] = v;
  }
  out.updatedAt = Math.max(tu, tv) || undefined;
  return out;
}

async function _syncPullAndMergeInner(){
  if(!supabaseClient) return;
  try{
    setSyncState('syncing');
    const { data, error } = await supabaseClient
      .from('workbench_sync')
      .select('data,updated_at,device')
      .eq('user_key', getSyncKey())
      .maybeSingle();
    if(error) throw error;
    if(!data){
      // 云端无数据 → 首次同步，推送本地
      await syncPush();
      return;
    }
    // 合并模式：本地 + 云端 全字段合并 → 谁有都保留，再推送合并结果上云
    // v2.1.81 修复 SYNC-006：移除未使用的死代码（cloudT, localT, isEmptyLocal, localHasExtra）
    // v2.1.81 修复 SYNC-001：isEmptyLocal 已在此处不再使用，syncPush 中的版本已补全 reviews/studyProgress
    try{
      const backup = JSON.stringify(DB);
      localStorage.setItem('gk_workbench_v1_local_backup_' + getSyncKey(), backup);
    }catch(e){}
    const cloud = data.data || {};
    const merged = mergeLocalCloud(DB, cloud);
    DB = merged;
    if(!Array.isArray(DB.weekTasks)) DB.weekTasks=[];
    if(!Array.isArray(DB.mistakes)) DB.mistakes=[];
    if(!Array.isArray(DB.knowledge)) DB.knowledge=[];
    if(!Array.isArray(DB.pushHistory)) DB.pushHistory=[];
    if(!DB.settings||typeof DB.settings!=='object') DB.settings={};
    DB.settings.lastSyncTime = new Date().toLocaleString('zh-CN');
    // 同步合并后执行新周重置（用合并后的 lastWeekMonday，避免用旧值误重置）
    const _now = new Date();
    const _wi = _now.getDay();
    const _monday = new Date(_now); _monday.setDate(_now.getDate() - (_wi===0?6:_wi-1));
    resetWeekDoneIfNeeded(_monday);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    setSyncState('connected');
    updateSyncBadge();
    toast('已同步合并（本地+云端数据都保留）');
    // 合并后立即推送合并结果上云（保证本地的复习状态/周计划勾选/新记录等同步出去）
    try{ await syncPush(); }catch(e){}
    // 重新渲染当前页面
    const cur = document.querySelector('.page.active')?.id?.replace('page-','') || 'home';
    renderPage(cur);
  }catch(e){
    setSyncState('error');
    console.warn('[Supabase pull]', e && e.message);
    if(e && /relation .* does not exist|42P01/.test(String(e.message))){
      toast('云端表不存在：请先在 Supabase SQL Editor 执行「复制建表SQL」');
    }
  }
}

/* 同步拉取+合并（带 15s 超时兜底）：手机网络到 supabase.co 挂起时不再永远停在"同步中"，
   超时后标记未连接并提示，数据仍在本地不丢 */
async function syncPullAndMerge(){
  const timer = new Promise((_, rej)=>setTimeout(()=>rej(new Error('sync timeout')), 15000));
  try{
    await Promise.race([_syncPullAndMergeInner(), timer]);
  }catch(e){
    setSyncState('error');
    console.warn('[Supabase sync]', e && e.message);
    if(/timeout/i.test(String(e && e.message))) toast('同步超时：网络连接不上云端，已断开，稍后会重试');
  }
}

/* 恢复"同步前备份"（覆盖发生前的本地备份，含被覆盖的复盘/记录） */
function restoreSyncBackup(){
  try{
    const b = localStorage.getItem('gk_workbench_v1_local_backup_' + getSyncKey());
    if(!b){ toast('未找到同步前备份'); return; }
    const d = JSON.parse(b);
    const rn = (d.reviews||[]).length, en=(d.errors||[]).length, rcn=(d.records||[]).length;
    if(!confirm('恢复同步前备份？\n含 复盘'+rn+'条 / 错题'+en+'条 / 记录'+rcn+'条\n（当前数据会被备份保留，可再恢复回来）')) return;
    // 先备份当前
    try{ localStorage.setItem('gk_workbench_v1_local_backup_' + getSyncKey() + '_cur', JSON.stringify(DB)); }catch(e){}
    DB = d;
    if(!DB.settings) DB.settings={};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    saveDB(); renderPage(currentPageName());
    toast('已恢复备份：复盘'+rn+'条');
  }catch(e){ toast('恢复失败：'+String(e.message||e)); }
}

/* 手动立即同步 */
async function syncNow(){
  // 若设置页打开着，先应用输入框里的 URL/Key/同步密钥 配置
  const urlInput = document.getElementById('sbUrl');
  const keyInput = document.getElementById('sbKey');
  const skInput = document.getElementById('sbSyncKey');
  if(urlInput || keyInput || skInput){
    if(!DB.settings.supabase) DB.settings.supabase = {};
    DB.settings.supabase.url = ((urlInput && urlInput.value) || SUPABASE_URL).trim();
    DB.settings.supabase.key = ((keyInput && keyInput.value) || SUPABASE_KEY).trim();
    if(skInput && skInput.value && skInput.value.trim() !== 'default'){
      DB.settings.supabase.syncKey = skInput.value.trim();
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    supabaseClient = null;
  }
  const cfg = getSupabaseCfg();
  if(!supabaseClient || SYNC_STATE === 'off'){
    await initSupabase();
  }
  if(!supabaseClient){
    toast('同步未连接：请检查网络或 Supabase 配置');
    return;
  }
  toast('正在同步…');
  await syncPullAndMerge();
  toast('同步完成');
  renderSettings();
}
/* 随机生成同步密钥 */
function genSyncKey(){
  try{
    const arr = new Uint8Array(12);
    (crypto.getRandomValues ? crypto.getRandomValues(arr) : arr.map(()=>Math.floor(Math.random()*256)));
    const key = 'gk_' + Array.from(arr).map(b=>b.toString(36).padStart(2,'0')).join('').slice(0, 16);
    const input = document.getElementById('sbSyncKey');
    if(input){ input.value = key; input.focus(); }
    toast('已生成新密钥，记得更新 SQL 里的 YOUR_SYNC_KEY 后点「立即同步」');
  }catch(e){ toast('生成失败，请手动输入随机字符串'); }
}
/* 状态弹窗 */
function showSyncStatus(){
  const map = { off:'⚪ 未配置', connecting:'🟡 连接中', connected:'🟢 已连接', syncing:'🟡 同步中', error:'🔴 未连接' };
  openModal(`<div class="modal-head"><h3>🔄 云端同步状态</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="padding:10px 4px;font-size:13px;line-height:2;color:var(--text);">
      <div>状态：${map[SYNC_STATE]||map.off}</div>
      <div>设备：${escapeHtml(getDeviceId())}</div>
      <div>最后同步：${escapeHtml((DB.settings&&DB.settings.lastSyncTime)||'尚未同步')}</div>
      <div style="font-size:11px;color:var(--text-soft);margin-top:6px;">点击「立即同步」上传本地数据并拉取其他设备的最新数据；连接成功后顶栏显示🟢。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">关闭</button>
      <button class="btn" style="flex:1" onclick="syncNow()">立即同步</button>
    </div>`);
}
