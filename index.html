/* 番茄ToDo专注数据导入 */
let _tomatoParsed=null;
async function importTomatoFile(input){
  const file=input.files[0];
  if(!file) return;
  toast('正在解析番茄ToDo数据...');
  try{
    let rows=[];
    const lower=file.name.toLowerCase();
    if(lower.endsWith('.csv')){
      const buf=await file.arrayBuffer();
      let text=new TextDecoder('utf-8').decode(buf);
      if(text.includes('\uFFFD')){
        try{ text=new TextDecoder('gbk').decode(buf); }catch(e){}
      }
      if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
      const arr=parseCSV(text);
      if(arr.length<2){ toast('文件为空'); return; }
      rows=buildRows(arr, findHeaderRow(arr));
    }else{
      if(!window.XLSX){
        await loadScript('https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      }
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      rows=[];
      wb.SheetNames.forEach(sn=>{
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
        rows=rows.concat(buildRows(aoa, findHeaderRow(aoa)));
      });
    }
    if(!rows.length){ toast('文件为空'); return; }
    const headers=Object.keys(rows[0]);
    const pick=(keys)=>{ for(const k of keys){ const hit=headers.find(h=>h.includes(k)); if(hit) return hit; } return ''; };
    const colDate=pick(['日期','时间','date','day']);
    const colDur=pick(['专注时长','时长','分钟','耗时','用时','duration','focus','专注']);
    const colTomato=pick(['番茄','pomodoro','个数']);
    if(!colDate){ toast('未识别到日期列'); return; }
    let colMin=colDur, isTomato=false, isHour=false;
    if(!colMin && colTomato){ colMin=colTomato; isTomato=true; }
    if(!colMin){ toast('未识别到时长列'); return; }
    if(colMin.includes('小时')||colMin.includes('hour')||colMin.includes('Hour')) isHour=true;
    // 解析汇总
    const dayMap={};
    let skipped=0;
    rows.forEach(r=>{
      const ds=parseFlexDate(r[colDate]);
      if(!ds){ skipped++; return; }
      let mins=parseFloat(String(r[colMin]).replace(/[^\d.]/g,''));
      if(isNaN(mins)||mins<=0){ skipped++; return; }
      if(isTomato) mins*=25;
      else if(isHour) mins*=60;
      dayMap[ds]=(dayMap[ds]||0)+Math.round(mins);
    });
    const days=Object.keys(dayMap).sort();
    if(!days.length){ toast('未解析到有效记录（日期格式不支持）'); return; }
    const totalMin=days.reduce((s,d)=>s+dayMap[d],0);
    // 按待办名称统计各模块专注时长
    const colTask=pick(['待办','任务','名称','内容','title','name']);
    const modTotal={};
    let unassignedMin=0;
    if(colTask){
      rows.forEach(r=>{
        const ds=parseFlexDate(r[colDate]);
        if(!ds) return;
        let mins=parseFloat(String(r[colMin]).replace(/[^\d.]/g,''));
        if(isNaN(mins)||mins<=0) return;
        if(isTomato) mins*=25;
        else if(isHour) mins*=60;
        const mk=identifyModule(String(r[colTask]||''));
        if(mk) modTotal[mk]=(modTotal[mk]||0)+Math.round(mins);
        else unassignedMin+=Math.round(mins);
      });
    }
    _tomatoParsed={dayMap,days,totalMin,colDate,colMin,isTomato,isHour,modTotal,unassignedMin};
    // 预览弹窗
    let previewBody='';
    if(colTask && Object.keys(modTotal).length){
      previewBody += '<div style="font-size:12px;margin-bottom:8px;color:var(--text-soft);">按待办名称识别到模块：</div>'+
        Object.entries(modTotal).map(([k,v])=>{
          const m=getTomatoModInfo(k);
          return `<span style="display:inline-block;margin:2px 6px 2px 0;font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg-soft);">${m.icon} ${m.name} ${Math.round(v/6)/10}h</span>`;
        }).join('');
      if(unassignedMin>0) previewBody += `<span style="font-size:11px;color:var(--text-light);">+ 未识别${Math.round(unassignedMin/6)/10}h</span>`;
      previewBody += '<div style="margin-top:8px;font-size:12px;background:var(--bg-soft);border-radius:8px;padding:10px;">';
    }
    previewBody += days.slice(0,5).map(d=>`${d}：${dayMap[d]}分钟`).join('<br>')+
      (days.length>5?`<br>…共${days.length}天`:'')+
      '</div>';
    const conflict=days.filter(d=>DB.studyCheckins[d]&&DB.studyCheckins[d]>0).length;
    openModal(`<div class="modal-head"><h3>🍅 番茄ToDo导入确认</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">
        识别列：日期「${colDate}」· 时长「${colMin}」${isTomato?'（按每番茄25分钟换算）':isHour?'（按小时换算）':''}${colTask?`· 待办「${colTask}」`:''}
      </div>
      ${previewBody}
      <div style="font-size:13px;color:var(--text);margin-top:8px;margin-bottom:4px;">
        共 <b style="color:var(--primary);">${days.length}</b> 天 · 合计 <b style="color:var(--primary);">${Math.round(totalMin/6)/10}</b> 小时（${totalMin}分钟）
      </div>
      ${conflict?`<div style="font-size:12px;color:var(--warning);margin-bottom:8px;">⚠️ 其中 ${conflict} 天已有打卡记录</div>`:''}
      <div class="modal-foot">
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
        <button class="btn" style="flex:1" onclick="doImportTomato('add')">累加合并</button>
        <button class="btn" style="flex:1;background:var(--accent);" onclick="doImportTomato('overwrite')">覆盖当天</button>
      </div>`);
  }catch(err){
    toast('解析失败：'+err.message);
    console.error(err);
  }
}
/* 根据待办名称识别模块：复合关键词优先，避免"数字推理/科学推理"误匹配到"推理"
   分类体系：模考(mk)/言语(yy)/判断(pd)/数量(sl)/资料(zl)/政治(zzll)/常识(cs)/错题复盘(ct)/申论(sl2)/面试(ms) */
const MODULE_KEYWORDS=[
  // 复合关键词（优先）
  ['数字推理','sl'],['科学推理','pd'],['逻辑推理','pd'],['逻辑填空','yy'],['语句表达','yy'],['片段阅读','yy'],
  ['综合应用','zh'],['常识判断','cs'],['政治理论','zzll'],['判断推理','pd'],['言语理解','yy'],
  ['数量关系','sl'],['资料分析','zl'],['图形推理','pd'],['定义判断','pd'],['类比推理','pd'],['数学运算','sl'],
  ['逻辑判断','pd'],
  // 通用统筹（模考）
  ['模考复盘','mk'],['模考','mk'],
  // 错题复盘（跨模块）
  ['错题','ct'],['二刷','ct'],
  // 申论
  ['申论','sl2'],['概括题','sl2'],['综合分析题','sl2'],['对策建议题','sl2'],['应用文','sl2'],['大作文','sl2'],
  ['时评','sl2'],['十五五','sl2'],['政府工作报告','sl2'],['新闻','sl2'],['论述','sl2'],['素材','sl2'],
  // 面试
  ['面试','ms'],['系统课','ms'],['逐字稿','ms'],
  // 短关键词
  ['速算','zl'],['资料','zl'],['图推','pd'],['判断','pd'],['推理','pd'],['图形','pd'],['定义','pd'],['类比','pd'],['科学','pd'],
  ['言语','yy'],['语句','yy'],['片段','yy'],['填词','yy'],
  ['数量','sl'],['数学','sl'],['数字','sl'],
  ['常识','cs'],['政治','zzll'],['时政','zzll'],['理论','zzll'],['磨耳朵','zzll'],
];
const TOMATO_EXTRA={
  mk:{icon:'📝',name:'模考'},
  ct:{icon:'🔄',name:'错题复盘'},
};
function getTomatoModInfo(k){
  const m=MODULES.find(x=>x.key===k);
  if(m) return {icon:m.icon,name:m.name};
  return TOMATO_EXTRA[k]||{icon:'📌',name:k};
}
function identifyModule(taskName){
  if(!taskName) return '';
  const s=String(taskName);
  for(const [kw,k] of MODULE_KEYWORDS){
    if(s.includes(kw)) return k;
  }
  return '';
}

function doImportTomato(mode){

function parseFlexDate(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v)) return localDateStr(v);
  const s=String(v).trim();
  if(!s) return null;
  // 纯数字：Excel序列号 或 毫秒时间戳
  if(/^\d+(\.\d+)?$/.test(s)){
    const n=parseFloat(s);
    if(n>20000&&n<60000){ const d=new Date(Math.round((n-25569)*86400000)); return localDateStr(d); }
    if(n>1e11){ const d=new Date(n); return isNaN(d)?null:localDateStr(d); }
    if(n>1e9){ const d=new Date(n*1000); return isNaN(d)?null:localDateStr(d); }
  }
  // 2025-11-15 / 2025/11/15 / 2025.11.15 / 2025-11-15 14:30
  const m=s.match(/(\d{4})[年\/\-.](\d{1,2})[月\/\-.](\d{1,2})日?/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  // 月日（无年份）
  const m2=s.match(/(\d{1,2})月(\d{1,2})日/);
  if(m2) return todayStr().slice(0,5)+'-'+String(+m2[1]).padStart(2,'0')+'-'+String(+m2[2]).padStart(2,'0');
  return null;
}
function parseCSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
/* 智能定位表头行：番茄ToDo导出的文件前几行可能是说明文字 */
function findHeaderRow(aoa){
  for(let i=0;i<Math.min(aoa.length,12);i++){
    const row=(aoa[i]||[]).map(c=>String(c));
    const hasDate=row.some(c=>/日期|时间|date|day/i.test(c));
    const hasDur=row.some(c=>/时长|分钟|番茄|专注|耗时|用时|duration|focus/i.test(c));
    if(hasDate&&hasDur) return i;
  }
  return 0;
}
/* 用表头行构建对象数组，跳过空行，保留Date对象 */
function buildRows(aoa, headerIdx){
  const headers=aoa[headerIdx].map(c=>String(c).trim());
  const out=[];
  for(let i=headerIdx+1;i<aoa.length;i++){
    const r=aoa[i];
    if(!r||r.every(c=>String(c).trim()==='')) continue;
    const o={};
    headers.forEach((h,ci)=>{
      const v=r[ci];
      o[h]=(v instanceof Date)?v:String(v==null?'':v).trim();
    });
    out.push(o);
  }
  return out;
}

  if(ds>todayStr()){ toast('未来日期不可打卡'); return; }
  if(data[ds]){
    // 已打卡 -> 弹窗修改或取消
    openWheelPicker(ds, data[ds], true);
  }else{
    openWheelPicker(ds, 1, false);
  }
}

/* 滚轮选择器 */
let wheelValue=60;
function openWheelPicker(ds, initVal, isEdit){
  // initVal是小时（可能小数），转分钟
  const initMinutes=Math.round(initVal*60);
  wheelValue=initMinutes;
  const minutes=[];
  for(let i=0;i<=1440;i+=5) minutes.push(i); // 0-24h，步长5分钟
  let initIdx=minutes.indexOf(initMinutes);
  if(initIdx<0) initIdx=minutes.findIndex(m=>m>=initMinutes);
  if(initIdx<0) initIdx=0;
  openModal(`<div class="modal-head"><h3>${calType==='study'?'学习':'运动'}打卡</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="text-align:center;font-size:13px;color:var(--text-soft);margin-bottom:6px;">${ds}</div>
    <div class="wheel-label">选择时长（分钟，步长5分钟）</div>
    <div class="wheel-picker">
      <div class="wheel-col" id="wheelH">
        <div class="sel-line"></div>
        <div class="wheel-list" id="wheelListH">
          ${minutes.map(m=>`<div>${m}</div>`).join('')}
        </div>
      </div>
    </div>
    <div style="text-align:center;font-size:18px;font-weight:700;color:var(--primary);margin:10px 0;" id="wheelShow">${initMinutes} 分钟</div>
    <div class="modal-foot">
      ${isEdit?`<button class="btn btn-danger" style="flex:1" onclick="cancelCheckin('${ds}')">取消打卡</button>`:''}
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1" onclick="saveCheckin('${ds}')">确认</button>
    </div>`);
  // 初始化滚轮位置
  const list=document.getElementById('wheelListH');
  list.style.transform=`translateY(-${initIdx*40}px)`;
  setupWheel('wheelH','wheelListH', minutes, initIdx, val=>{
    wheelValue=val;
    const h=Math.round(val/6)/10;
    document.getElementById('wheelShow').textContent=val+' 分钟（'+(Number.isInteger(h)?h:h.toFixed(1))+' 小时）';
  });
}
function setupWheel(colId, listId, arr, initIdx, cb){
  const col=document.getElementById(colId);
  const list=document.getElementById(listId);
  let startY=0, currentY=-initIdx*40, lastY=currentY;
  list.style.transform=`translateY(${currentY}px)`;
  function apply(){
    let idx=Math.round(-currentY/40);
    idx=Math.max(0,Math.min(arr.length-1,idx));
    currentY=-idx*40;
    list.style.transform=`translateY(${currentY}px)`;
    list.style.transition='transform .15s';
    setTimeout(()=>list.style.transition='',150);
    cb(arr[idx]);
  }
  col.ontouchstart=e=>{ startY=e.touches[0].clientY; lastY=currentY; list.style.transition=''; };
  col.ontouchmove=e=>{
    currentY=lastY+(e.touches[0].clientY-startY);
    let idx=Math.round(-currentY/40);
    idx=Math.max(0,Math.min(arr.length-1,idx));
    currentY=Math.max(-(arr.length-1)*40, Math.min(0,currentY));
    list.style.transform=`translateY(${currentY}px)`;
    cb(arr[idx]);
  };
  col.ontouchend=apply;
  // 鼠标支持（测试用）
  let mDown=false;
  col.onmousedown=e=>{ mDown=true; startY=e.clientY; lastY=currentY; list.style.transition=''; };
  document.onmousemove=e=>{ if(!mDown)return; currentY=lastY+(e.clientY-startY); currentY=Math.max(-(arr.length-1)*40,Math.min(0,currentY)); list.style.transform=`translateY(${currentY}px)`; let idx=Math.round(-currentY/40); idx=Math.max(0,Math.min(arr.length-1,idx)); cb(arr[idx]); };
  document.onmouseup=e=>{ if(mDown){mDown=false;apply();} };
}
function saveCheckin(ds){
  const data = calType==='study'?DB.studyCheckins:DB.sportCheckins;

  const hours=Math.round(wheelValue/60*100)/100;

/* 试卷分析报告：飞书链接抓取 */
async function paperImportFeishu(){
  const url=document.getElementById('pp_analysis_url').value.trim();
  const status=document.getElementById('pp_analysis_status');
  if(!url){ toast('请粘贴飞书链接'); return; }
  if(!/feishu\.cn|larksuite\.com/.test(url)){ toast('请粘贴飞书文档链接'); return; }
  status.textContent='正在抓取文档...';
  status.style.color='var(--primary)';
  const r=await fetchFeishuContent(url);
  if(!r){
    status.innerHTML='❌ 抓取失败：该文档为<b>私有文档（需登录）</b>或网络受限。<br>请在飞书中把文档设为「互联网获取」/公开分享后再试；或导出Word上传、手动粘贴。';
    status.style.color='var(--danger)';
    return;
  }
  const box=document.getElementById('pp_analysis');
  if(box.value && !confirm('报告框已有内容，用抓取结果覆盖？')) return;
  box.value=r.content;
  status.textContent='✅ 抓取成功！已填入正文（'+r.content.length+'字），检查后保存';
  status.style.color='var(--primary)';
  toast('飞书文档已导入');
}
/* 试卷分析报告：Word/文本上传 */
async function paperUploadDoc(input){
  const file=input.files[0];
  if(!file) return;
  if(file.name.endsWith('.txt')){
    const text=await file.text();
    const box=document.getElementById('pp_analysis');
    if(box.value && !confirm('报告框已有内容，用文件内容覆盖？')) return;
    box.value=text;
    toast('已导入文本内容');
  }else{
    toast('正在解析Word...');
    try{
      if(!window.mammoth){
        await loadScript('https://cdn.bootcdn.net/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      }
      const arrayBuffer=await file.arrayBuffer();
      const result=await window.mammoth.extractRawText({arrayBuffer});
      const box=document.getElementById('pp_analysis');
      if(box.value && !confirm('报告框已有内容，用Word内容覆盖？')) return;
      box.value=result.value;
      toast('已导入Word内容');
    }catch(e){
      toast('解析失败，请尝试.txt格式');
    }
  }
}
function updatePaperSummary(){
  const box=document.getElementById('pp_summary');
  if(!box) return;
  let tc=0, tt=0, td=0;
  document.querySelectorAll('[data-mod][data-kind="correct"]').forEach(inp=>{
    const mod=inp.dataset.mod;
    const totalInp=document.querySelector(`[data-mod="${mod}"][data-kind="total"]`);
    const durInp=document.querySelector(`[data-mod="${mod}"][data-kind="duration"]`);
    tc+=parseFloat(inp.value)||0;
    tt+=parseFloat(totalInp?totalInp.value:0)||0;
    td+=parseFloat(durInp?durInp.value:0)||0;
  });
  const rate=tt>0?(tc/tt*100):0;
  const score=Math.round(rate*10)/10;
  document.getElementById('pp_sum_c').textContent=tc;
  document.getElementById('pp_sum_t').textContent=tt;
  document.getElementById('pp_sum_s').textContent=score;
  document.getElementById('pp_sum_r').textContent=Math.round(rate)+'%';
  document.getElementById('pp_sum_d').textContent=td;
}
function savePaper(id, opts){
  opts=opts||{};
  let name=document.getElementById('pp_name').value.trim();
  const type=document.getElementById('pp_type').value;
  const examTypeEl=document.getElementById('pp_exam_type');
  const examType=(type==='模考'&&examTypeEl)?examTypeEl.value:'';
  const date=document.getElementById('pp_date').value;
  const note=document.getElementById('pp_note').value.trim();
  if(!date){ toast('请选择日期'); return false; }
  if(!name){
    if(opts && opts.auto){ name='未命名试卷-'+date; }
    else { toast('请填写名称'); return false; }
  }
  const modules={};
  document.querySelectorAll('[data-mod][data-kind="correct"]').forEach(inp=>{
    const mod=inp.dataset.mod;
    const totalInp=document.querySelector(`[data-mod="${mod}"][data-kind="total"]`);
    const durInp=document.querySelector(`[data-mod="${mod}"][data-kind="duration"]`);
    const correct=parseFloat(inp.value)||0;
    const total=parseFloat(totalInp?totalInp.value:0)||0;
    const dur=parseInt(durInp?durInp.value:0)||0;
    if(correct>0||total>0||dur>0){ modules[mod]={correct,total,duration:dur}; }
  });
  let tc=0, tt=0;
  for(const k in modules){ tc+=modules[k].correct; tt+=modules[k].total; }
  const score=tt>0?Math.round(tc/tt*1000)/10:0;
  // 总耗时 = 各模块用时之和
  const duration=Object.values(modules).reduce((s,m)=>s+(m.duration||0),0);
  // 分析报告
  const analysisUrl=(document.getElementById('pp_analysis_url')||{}).value?.trim()||'';
  const analysisText=(document.getElementById('pp_analysis')||{}).value?.trim()||'';
  const analysis=(analysisText||analysisUrl)?{text:analysisText,feishuUrl:analysisUrl,updatedAt:todayStr()}:undefined;
  if(id){
    const p=DB.papers.find(x=>x.id===id);
    Object.assign(p,{name,type,examType,date,score,duration,modules,note,analysis,updatedAt:Date.now()});
  }else{
    DB.papers.push({id:uid(),name,type,examType,date,score,duration,modules,note,analysis,updatedAt:Date.now()});
  }
  saveDB(); closeModal(); renderPaper(); toast('已保存');
  return true;
}
function delPaper(id){
  if(!confirm('删除此试卷？')) return;
  markDeleted('papers', id);
  DB.papers=DB.papers.filter(p=>p.id!==id);
  saveDB(); renderPaper();
}
function confirmDelPaper(id){ delPaper(id); closeModal(); }

/* ============================================================
   渲染：积累页（原知识库，按用户要求重组分类）
   ============================================================ */
// 积累页分类映射：显示名 → 内部KB分类（支持合并多个分类）
const ACCU_CATS = [
  {display:'常识', cats:['常识']},
  {display:'政治理论', cats:['政治理论']},
  {display:'每日时政', cats:['时政']},
  {display:'言语素材', cats:['言语理解']},
  {display:'申论素材', cats:['申论小题积累','申论作文素材']},
  {display:'面试', cats:['面试']},
];
let kbCat='常识';
/* 提取言语素材词条（复用推送页解析逻辑） */
function extractYyWords(kbItems){
  const words=[]; const seen=new Set();
  kbItems.forEach(k=>{
    /* 剔除"文段积累"模块（与"高频词/易混淆词语"并列的独立模块，标题下是整段文段，不是词条）：
       从"文段积累"标题行开始跳过，直到下一个模块标题（一、/（一）/编号词条/已知模块名）或文档结尾 */
    const wdHead=/^(?:[一二三四五六七八九十\d]+[.、]\s*)?文段积累[：:]?\s*$/;
    const isModuleHead=(t)=>{
      if(/^[一二三四五六七八九十]+[、．.]/.test(t)) return true;
      if(/^（[一二三四五六七八九十\d]+）/.test(t)) return true;
      if(/^\d+[.、]\s*\S{2,15}$/.test(t)) return true;
      const base=t.replace(/^[#*◆▶▷▼\s]+/,'').replace(/[*#:：]+$/,'').trim();
      return ['高频词','易混淆词语','文段积累','近义词','反义词','成语','词语','词汇','辨析','积累'].includes(base);
    };
    const rawLines=(k.content||'').split(/\n/).map(s=>s.trim().replace(/^[#*◆▶▷▼\s]+/,'').replace(/[*#]+$/,''));
    let skipping=false; const cleaned=[];
    for(let i=0;i<rawLines.length;i++){
      const t=rawLines[i];
      if(wdHead.test(t)){ skipping=true; continue; }
      if(skipping && isModuleHead(t)) skipping=false;
      if(!skipping) cleaned.push(t);
    }
    const content=cleaned.filter(Boolean).join('\n');
    const txt=(k.title||'')+'\n'+content;
    /* 对比组（易混淆词语）：识别"1. 抵御VS克服""浸润VS渗透VS浸透"式标题（2~7个词），
       把各组各自的释义与例句整对作为一条保留。
       规则：标题行 = 词A VS 词B [VS 词C…]；随后"词：释义"行开始该侧，紧跟的普通行作为该词例句；
       若释义行内还挤着其它词条（无换行），按出现位置自动拆开。 */
    const pairRe=/^(?:[一二三四五六七八九十\d]+[.、]\s*)?([^【】\n：、，。．.；;！!？?\s]{2,12}(?:\s*VS\s*[^【】\n：、，。．.；;！!？?\s]{2,12}){1,6})\s*[。．.]?$/i;
    const lines=txt.split(/\n/).map(s=>s.trim().replace(/^[#*◆▶▷▼\s]+/,'').replace(/[*#]+$/,'')).filter(Boolean);
    for(let i=0;i<lines.length;i++){
      const lm=lines[i].match(pairRe);
      if(!lm) continue;
      const pairWords=lm[1].split(/\s*VS\s*/i);
      if(pairWords.length<2 || new Set(pairWords).size!==pairWords.length) continue;
      const sides={}; pairWords.forEach(w=>{ sides[w]={def:'',examples:[]}; });
      let cur=null, added=false;
      for(let j=i+1;j<lines.length;j++){
        const ln=lines[j];
        if(lines[j].match(pairRe)) break; // 下一个对比组
        const dm=ln.match(/^([^【】\n：、，。．.；;！!？?\s]{2,12})\s*[：:]\s*(.+)$/);
        const dm2=ln.match(/^【([^】\n]{2,15})】\s*(.+)$/); // 个别组用【词】释义格式
        if(dm||dm2){
          const w=dm?dm[1]:dm2[1];
          if(/积累$/.test(w)) continue; // "文段积累："等元标签行跳过
          if(!sides[w]) break; // 不属于本组的"词：释义"行 → 本组结束
          if(dm){
            // 释义行内可能还挤着其它词条（无换行）：按出现位置拆开
            let rest=dm[2], parts=[], cw=w;
            while(true){
              let best=null,bestPos=-1;
              for(const pw of pairWords){
                if(pw===cw) continue;
                const p=rest.indexOf(pw+'：');
                const p2=p<0?rest.indexOf(pw+':'):p;
                if(p2>=0&&(bestPos<0||p2<bestPos)){ best=pw; bestPos=p2; }
              }
              if(best===null||bestPos<0) break;
              const pre=rest.slice(0,bestPos).trim();
              if(pre) parts.push({word:cw,def:pre});
              cw=best;
              rest=rest.slice(bestPos+best.length+1);
            }
            if(rest.trim()) parts.push({word:cw,def:rest.trim()});
            parts.forEach(p=>{ if(!sides[p.word].def) sides[p.word].def=p.def; });
            cur=parts.length?parts[parts.length-1].word:w;
          }else{
            sides[w].def=dm2[2].trim();
            cur=w;
          }
          continue;
        }
        // 例句：追加到当前侧（≥6字，排除"用途："说明行）
        if(cur && ln.length>=6 && !/^用途[：:]/.test(ln)) sides[cur].examples.push(ln);
      }
      if(pairWords.every(w=>sides[w].def)){
        const pairKey=pairWords.join('VS');
        if(!seen.has(pairKey)){
          seen.add(pairKey); pairWords.forEach(w=>seen.add(w));
          let s='【'+pairKey+'】';
          pairWords.forEach(w=>{
            s+='\n'+w+'：'+sides[w].def;
            if(sides[w].examples.length) s+='\n例：'+sides[w].examples.slice(0,2).join('\n例：');
          });
          words.push(s);
          added=true;
        }
      }
      if(added){ // 本组已消费的行跳过，避免再被单条规则重复抽取
        let j=i+1;
        while(j<lines.length && !lines[j].match(pairRe)) j++;
        i=j-1;
      }
    }
    const re1=/(?:^|\n)【([^】\n]{2,15})】\s*([^\n]{2,150})/g;
    let m;
    while((m=re1.exec(txt))){
      const word=m[1], body=m[2].trim();
      if(/积累$/.test(word)||/^(高频|易混|生词|词语|词汇|近义|反义|辨析|素材|笔记|总结)$/.test(word)) continue;
      if(!seen.has(word)){ seen.add(word); words.push('【'+word+'】'+body.slice(0,120)); }
    }
    const re2=/(?:^|\n)[【]?([^】\n：、，]{2,15})[】]?[:：]\s*([^\n]{2,150})/g;
    while((m=re2.exec(txt))){
      const word=m[1], body=m[2].trim();
      if(/积累$/.test(word)||/^(高频|易混|生词|词语|词汇|近义|反义|辨析)$/.test(word)) continue;
      if(!seen.has(word)){ seen.add(word); words.push('【'+word+'】'+body.slice(0,120)); }
    }
    /* 独立行词条（高频词等）：词单独一行，后续行为释义行与（来源）例句行。
       词名取独立行本身（修复旧兜底把下一行短词当词名的错位，如"引擎"被提取成"发动机"）；
       释义行合并展示（pre-wrap 换行），例句行带"例："前缀。 */
    for(let i=0;i<lines.length-1;i++){
      const cur=lines[i].replace(/^[【】\s]+|[【】\s]+$/g,'');
      if(cur.length<2||cur.length>8) continue;
      if(/[。！？.：；，、]$/.test(cur)) continue;                 // 词不以标点结尾
      if(/^[（(【\d#*]/.test(cur)) continue;                      // 不以（/(/【/数字/#* 开头
      if(/积累$/.test(cur)||/^(高频词|易混淆词语|生词|正确搭配|文段积累)$/.test(cur)) continue;
      if(cur===(k.title||'').trim()||seen.has(cur)) continue;
      if(lines[i].match(pairRe)) continue;                        // 对比组标题（已另行处理）
      let defs=[], exs=[], sawEx=false;
      for(let j=i+1;j<lines.length;j++){
        const ln=lines[j];
        if(lines[j].match(pairRe)) break;                         // 对比组标题
        if(/^[^【】\n：、，。．.；;！!？?\s]{2,12}\s*[：:]/.test(ln)||/^【[^】]+】/.test(ln)) break; // 下一个"词："/【词】条目
        if(/^[一二三四五六七八九十]+[、．.]/.test(ln)||/^（[一二三四五六七八九十\d]+）/.test(ln)) break; // 模块/小节标题
        if(/^[（(][^）)]{2,20}[）)]/.test(ln)){ exs.push(ln); sawEx=true; continue; } // （来源）例句
        if(ln.length>=6 && !/^——/.test(ln) && !/^用途[：:]/.test(ln)){ defs.push(ln); continue; } // 释义行
        if(ln.length>=6) continue;
        // 短行（<6字）：例句之后出现→下一个词条；例句之前→释义（如"引擎"下的"发动机"）
        if(sawEx) break;
        defs.push(ln);
      }
      if(defs.length){
        seen.add(cur);
        let s='【'+cur+'】';
        s+='\n'+defs.join('\n');
        if(exs.length) s+='\n例：'+exs.slice(0,2).join('\n例：');
        words.push(s);
        i+=defs.length+exs.length; // 跳过已消费的行
      }
    }
  });
  return words;
}

  const list=DB.knowledge.filter(k=>curTab.cats.includes(k.cat)).sort((a,b)=>b.date.localeCompare(a.date));

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="flex:1;display:flex;align-items:center;gap:6px;min-width:0;">

      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;" onclick="event.stopPropagation()">
        <button class="btn btn-sm btn-ghost" style="padding:3px 8px;font-size:11px;" onclick="kbModal('${k.id}')">编辑</button>
        <button class="btn btn-sm btn-ghost" style="padding:3px 8px;font-size:11px;color:var(--danger);" onclick="delKB('${k.id}')">删除</button>
      </div>
    </div>
    <div class="k-meta">${k.date} · ${k.source||'手动输入'}${k.feishuUrl?` · <a href="${k.feishuUrl}" target="_blank" style="color:var(--info)" onclick="event.stopPropagation()">飞书↗</a>`:''}</div>
  </div>`).join(''):'<div class="empty-state"><div class="emoji">📥</div><div class="txt">暂无内容，点击新增或导入</div></div>';
  return `<div class="kb-tabs">${cats}</div>${listHtml}`;
}
/* 积累页：每日随机展示知识库内容 + 时政实时新闻（类似推送页风格） */
/* 缓存机制：同一天+同一刷新次数内，直接用缓存的HTML，不再重新渲染/抓取新闻。
   只有点"换一批"（accuRefresh）或新一天才会清除缓存重新渲染。 */
async function renderAccu(){
  const seed=getAccuSeed();
  // 知识库签名：条数+最新更新时间，知识库变化时缓存自动失效
  const kbItems=DB.knowledge||[];
  const kbSig=kbItems.length+'_'+(kbItems.length?Math.max(...kbItems.map(k=>k.updatedAt||0)):0);
  // 缓存命中：种子相同+知识库签名相同，才用缓存（防止知识库变化后仍显示旧缓存）
  if(DB.accuHtmlCache && DB.accuHtmlCache.seed===seed && DB.accuHtmlCache.kbSig===kbSig && DB.accuHtmlCache.html){
    const el=document.getElementById('page-accu');
    if(el){ el.innerHTML=DB.accuHtmlCache.html; return; }
  }
  const catIcons={'常识':'🌐','政治理论':'🏛️','每日时政':'📰','言语素材':'💬','申论素材':'📝','面试':'🎤'};
  let cards='';
  // 每日时政：实时抓取新闻（异步），放在政治理论后面
  let liveNews=null;
  for(const cat of ACCU_CATS){
    const icon=catIcons[cat.display]||'📄';
    if(cat.display==='每日时政'){
      // 每日时政卡片：实时新闻（带收起/展开）
      if(!liveNews) liveNews=await fetchLiveNews(false);
      const hasLive=liveNews.gov.length||liveNews.gd.length;
      let newsSections='';
      if(hasLive){
        let gdList=liveNews.gd.slice(0,3);
        if(!gdList.length){
          const gdPool=SZ_HOT_POOL.filter(h=>h.isGD);
          gdList=seededShuffle(gdPool,seed+1).slice(0,2).map(h=>({title:h.title,url:h.url||''}));
        }
        if(gdList.length){
          newsSections+=`<details open style="margin-bottom:6px;"><summary style="font-size:12px;font-weight:600;color:var(--primary);cursor:pointer;padding:4px 0;">广东要闻</summary><div>${gdList.map(n=>`<div style="padding:3px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);">${linkify('· '+n.title+(n.url?'\n  '+n.url:''))}</div>`).join('')}</div></details>`;
        }
        const govList=liveNews.gov.filter(n=>!liveNews.gd.some(g=>g.title===n.title)).slice(0,6);
        if(govList.length){
          newsSections+=`<details open style="margin-bottom:6px;"><summary style="font-size:12px;font-weight:600;color:var(--primary);cursor:pointer;padding:4px 0;">时政热点</summary><div>${govList.map(n=>{
            let line='· '+(n.date?'['+n.date.slice(5)+'] ':'')+n.title;
            if(n.url) line+='\n  '+n.url;
            if(n.digest) line+='\n  '+n.digest;
            return `<div style="padding:3px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);">${linkify(line)}</div>`;
          }).join('')}</div></details>`;
        }
        cards+=`<div class="card"><div class="card-title"><span class="left"><span class="emoji">${icon}</span>${cat.display}</span><span class="section-tag">${fmtNewsTime(liveNews.t)||'实时'}</span></div>${newsSections}</div>`;
      }else{
        // 离线兜底
        const gdPool=SZ_HOT_POOL.filter(h=>h.isGD);
        const otherPool=SZ_HOT_POOL.filter(h=>!h.isGD);
        const hot=[...seededShuffle(gdPool,seed+1).slice(0,2), ...seededShuffle(otherPool,seed+2).slice(0,4)];
        newsSections=`<details open style="margin-bottom:6px;"><summary style="font-size:12px;font-weight:600;color:var(--primary);cursor:pointer;padding:4px 0;">近期热点</summary><div>${hot.map(h=>`<div style="padding:3px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);">${linkify('· ['+h.date+'] '+h.title+(h.url?'\n  '+h.url:''))}</div>`).join('')}</div></details>`;
        cards+=`<div class="card"><div class="card-title"><span class="left"><span class="emoji">${icon}</span>${cat.display}</span><span class="section-tag">近期</span></div>${newsSections}</div>`;
      }
      // 也显示KB中的时政条目（如果有），逐行解析同常识/政治理论
      const kbItems=DB.knowledge.filter(k=>cat.cats.includes(k.cat));
      if(kbItems.length){
        const tzTopics=[];
        let tzCur=null, tzItems=[], tzCurItem=null;
        kbItems.forEach(k=>{
          const lines=(k.content||'').split(/\n/).map(l=>l.replace(/^[▼▷▶\s#*]+/,'').replace(/[*#]+$/,'').trim()).filter(Boolean);
          for(const line of lines){
            if(/^[一二三四五六七八九十]+[、，]/.test(line)){
              if(tzCurItem){ tzItems.push(tzCurItem); tzCurItem=null; }
              if(tzCur&&tzItems.length) tzTopics.push({topic:tzCur, items:tzItems});
              tzCur=line; tzItems=[];
              continue;
            }
            const m2=line.match(/^[（(][一二三四五六七八九十\d]+[）)]\s*(.+)$/);
            if(m2){
              if(tzCurItem){ tzItems.push(tzCurItem); tzCurItem=null; }
              if(tzCur&&tzItems.length) tzTopics.push({topic:tzCur, items:tzItems});
              tzCur=m2[1].trim(); tzItems=[];
              continue;
            }
            const m3=line.match(/^\d+[\.、]\s*(.+)$/);
            if(m3 && m3[1].length>=3){
              if(tzCurItem){ tzItems.push(tzCurItem); }
              tzCurItem=m3[1].trim();
              continue;
            }
            const sub=line.replace(/^[-•◦·]\s*/,'').trim();
            if(tzCurItem && sub.length>=2){
              tzCurItem+='\n'+sub;
            }else if(!tzCurItem && line.length>=6){
              tzCurItem=line;
            }
          }
        });
        if(tzCurItem){ tzItems.push(tzCurItem); }
        if(tzCur&&tzItems.length) tzTopics.push({topic:tzCur, items:tzItems});
        if(!tzCur && tzItems.length) tzTopics.push({topic:'知识点', items:tzItems});
        if(tzTopics.length){
          const rich=tzTopics.filter(t=>t.items.length>=5);
          const pool=rich.length?rich:tzTopics.filter(t=>t.items.length>=2);
          const finalPool=pool.length?pool:tzTopics;
          const t=seededShuffle(finalPool,seed+10)[0];
          const picked=seededShuffle(t.items,seed+11).slice(0,5);
          if(picked.length){
            cards+=`<div class="card"><div class="card-title"><span class="left"><span class="emoji">${icon}</span>时政积累</span><span class="section-tag">${escapeHtml(t.topic)}</span></div>
            ${picked.map(p=>`<div style="padding:4px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);white-space:pre-wrap;">${escapeHtml(p)}</div>`).join('')}</div>`;
          }
        }
      }
      continue;
    }
    const items=DB.knowledge.filter(k=>cat.cats.includes(k.cat));
    if(!items.length) continue;
    if(cat.display==='言语素材'){
      const words=extractYyWords(items);
      const picked=seededShuffle(words,seed+20).slice(0,12);
      if(picked.length){
        cards+=`<div class="card">
          <div class="card-title"><span class="left"><span class="emoji">${icon}</span>${cat.display}</span><span class="section-tag">${words.length}条</span></div>
          ${picked.map(w=>{
            if(w.indexOf('\n')>-1){
              // 多行条目：对比组标题高亮、单条标题加粗、释义正常色、例句淡化
              const segs=w.split('\n').map(s=>{
                if(/^【[^】]*VS[^】]*】$/.test(s)) return `<span style="font-weight:700;color:var(--primary);">${escapeHtml(s)}</span>`;
                if(/^例：/.test(s)) return `<span style="color:var(--text-light);">${escapeHtml(s)}</span>`;
                if(/^【.+】$/.test(s)) return `<span style="font-weight:600;">${escapeHtml(s)}</span>`;
                return escapeHtml(s);
              }).join('\n');
              return `<div style="padding:6px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);white-space:pre-wrap;word-break:break-word;">${segs}</div>`;
            }
            return `<div style="padding:4px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);">${linkify(w)}</div>`;
          }).join('')}
        </div>`;
      }
    } else if(cat.display==='申论素材'){
      const slItems=items.filter(k=>!/小题/.test(k.cat||''));
      const topics=parseShenlunContent(slItems);
      if(topics.length){
        const picked=seededShuffle(topics,seed+30).slice(0,1);
        for(const t of picked){
          let sectionHtml='';
          for(const [type,arr] of Object.entries(t.sections)){
            if(!arr||!arr.length) continue;
            // 案例类：过滤纯空案例，有内容的清理结尾空"→可论证："后保留
            const filtered=(type==='案例举证'||type==='案例')?arr.filter(x=>isCaseValid(x)).map(x=>cleanCaseTail(x)):arr;
            if(!filtered.length) continue;
            const p2=seededShuffle(filtered,seed+31).slice(0,2);
            sectionHtml+=`<details open style="margin-bottom:6px;"><summary style="font-size:12px;font-weight:600;color:var(--text);cursor:pointer;padding:4px 0;">${escapeHtml(type)}</summary><div style="padding:4px 0 6px;">${p2.map(x=>`<div style="font-size:12px;color:var(--text);line-height:1.7;padding:2px 0;">${escapeHtml(x)}</div>`).join('')}</div></details>`;
          }
          cards+=`<div class="card"><div class="card-title"><span class="left"><span class="emoji">${icon}</span>${cat.display}</span><span class="section-tag">${escapeHtml(t.topic||'')}</span></div>${sectionHtml}</div>`;
        }
      }
      const xtItems=items.filter(k=>/小题/.test(k.cat||''));
      if(xtItems.length){
        const xtData=parseXiaoTi(xtItems);
        const xtCats=Object.keys(xtData).filter(k=>xtData[k].length);
        if(xtCats.length){
          const pickCats=seededShuffle(xtCats,seed+40).slice(0,3);
          const xtHtml=pickCats.map(xc=>`<details style="margin-bottom:6px;"><summary style="font-size:12px;font-weight:600;color:var(--text);cursor:pointer;padding:4px 0;">${escapeHtml(xc)}</summary><div>${seededShuffle(xtData[xc],seed+41).slice(0,3).map(x=>`<div style="font-size:12px;color:var(--text);padding:2px 0;line-height:1.7;">${escapeHtml(x)}</div>`).join('')}</div></details>`).join('');
          cards+=`<div class="card"><div class="card-title"><span class="left"><span class="emoji">${icon}</span>申论小题</span><span class="section-tag">${xtCats.length}类</span></div>${xtHtml}</div>`;
        }
      }
      // 人民时评卡片：与申论素材、申论小题平级，放在小题后面。
      // 两个分区：人民日报·人民时评（plsp）+ 南方日报·评论员（nfpl），分开展示
      const plsp=(liveNews&&liveNews.plsp)||[];
      const nfpl=(liveNews&&liveNews.nfpl)||[];
      if(plsp.length||nfpl.length){
        let secHtml='';
        const newsItem=n=>{
          let line='· '+(n.date?'['+n.date.slice(5)+'] ':'')+n.title;
          if(n.url) line+='\n  '+n.url;
          if(n.digest) line+='\n  '+n.digest;
          return `<div style="padding:3px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);">${linkify(line)}</div>`;
        };
        if(plsp.length){
          secHtml+=`<div style="font-size:12px;font-weight:600;color:var(--primary);padding:4px 0 2px;">人民日报 · 人民时评</div>`+plsp.slice(0,6).map(newsItem).join('');
        }
        if(nfpl.length){
          secHtml+=`<div style="font-size:12px;font-weight:600;color:var(--primary);padding:6px 0 2px;">南方日报 · 评论员</div>`+nfpl.slice(0,6).map(n=>newsItem({...n,title:n.title.replace(/^南方日报评论员[：:]\s*/,'')})).join('');
        }
        cards+=`<div class="card"><div class="card-title"><span class="left"><span class="emoji">📰</span>人民时评</span><span class="section-tag">${(liveNews&&fmtNewsTime(liveNews.t))||'实时'}</span></div>${secHtml}</div>`;
      }
    } else {
      // 常识/政治理论/面试：逐行解析，编号行(1. 2. 等)开始新知识点，
      // 后续非编号行（子项、缩进行）追加到当前知识点
      const topics=[];
      let curTopic=null, curItems=[], curItem=null;
      items.forEach(k=>{
        const lines=(k.content||'').split(/\n/).map(l=>l.replace(/^[▼▷▶\s#*]+/,'').replace(/[*#]+$/,'').trim()).filter(Boolean);
        for(const line of lines){
          // 一级标题：一、经济常识
          if(/^[一二三四五六七八九十]+[、，]/.test(line)){
            if(curItem){ curItems.push(curItem); curItem=null; }
            if(curTopic&&curItems.length) topics.push({topic:curTopic, items:curItems});
            curTopic=line; curItems=[];
            continue;
          }
          // 二级标题：（一）宪法
          const m2=line.match(/^[（(][一二三四五六七八九十\d]+[）)]\s*(.+)$/);
          if(m2){
            if(curItem){ curItems.push(curItem); curItem=null; }
            if(curTopic&&curItems.length) topics.push({topic:curTopic, items:curItems});
            curTopic=m2[1].trim(); curItems=[];
            continue;
          }
          // 编号内容行：1. xxx 或 1、 xxx → 开始新知识点
          const m3=line.match(/^\d+[\.、]\s*(.+)$/);
          if(m3 && m3[1].length>=3){
            // 先保存上一个知识点
            if(curItem){ curItems.push(curItem); }
            curItem=m3[1].trim();
            continue;
          }
          // 子项行：以 - • ◦ 开头，或缩进内容，或短行 → 追加到当前知识点
          const sub=line.replace(/^[-•◦·]\s*/,'').trim();
          if(curItem && sub.length>=2){
            curItem+='\n'+sub;
          }else if(!curItem && line.length>=6){
            // 没有编号前缀的独立内容行，直接作为知识点
            curItem=line;
          }
        }
      });
      // 收尾
      if(curItem){ curItems.push(curItem); }
      if(curTopic&&curItems.length) topics.push({topic:curTopic, items:curItems});
      // 无话题标题时也保留
      if(!curTopic && curItems.length) topics.push({topic:'知识点', items:curItems});

      if(topics.length){
        // 优先选有≥5条知识点的话题，确保抽取效果好
        const rich=topics.filter(t=>t.items.length>=5);
        const pool=rich.length?rich:topics.filter(t=>t.items.length>=2);
        const finalPool=pool.length?pool:topics;
        const t=seededShuffle(finalPool,seed+50)[0];
        const picked=seededShuffle(t.items,seed+51).slice(0,5);
        cards+=`<div class="card">
          <div class="card-title"><span class="left"><span class="emoji">${icon}</span>${cat.display}</span><span class="section-tag">${escapeHtml(t.topic)}</span></div>
          ${picked.map(p=>`<div style="padding:4px 0;font-size:12px;color:var(--text);line-height:1.7;border-bottom:1px solid var(--border);white-space:pre-wrap;">${escapeHtml(p)}</div>`).join('')}
        </div>`;
      }
    }
  }
  if(!cards) cards='<div class="empty-state"><div class="emoji">🗃️</div><div class="txt">知识库暂无内容，请在设置 → 知识库管理中导入</div></div>';
  const accuHtml=`<div class="card">
      <div class="card-title"><span class="left"><span class="emoji">🗃️</span>积累</span>
        <button class="btn btn-sm btn-outline" onclick="accuRefresh()">🔄 换一批</button>
      </div>
      <div style="font-size:11px;color:var(--text-light);margin:-4px 0 8px;">每日从知识库随机展示积累内容 · 点击换一批刷新</div>
    </div>
    ${cards}`;
  document.getElementById('page-accu').innerHTML=accuHtml;
  // 缓存渲染结果（同一天+同一刷新次数+知识库不变时不重新渲染）
  DB.accuHtmlCache={seed:seed, kbSig:kbSig, html:accuHtml};
  saveDB();
}
function setKbCat(c){
  kbCat=c;
  const el=document.getElementById('settingsKBList');
  if(el) el.innerHTML=renderSettingsKBList();
}
function kbCatModal(){
  openModal(`<div class="modal-head"><h3>新增子分类</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>分类名称</label><input id="kc_name" placeholder="如：成语辨析"></div>
    <div class="modal-foot"><button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
    <button class="btn" style="flex:1" onclick="saveKbCat()">保存</button></div>`);

function saveKbCat(){
  const name=document.getElementById('kc_name').value.trim();
  if(!name){toast('请输入名称');return;}
  if(DB.kbCats.includes(name)){toast('已存在');return;}
  DB.kbCats.push(name);
  saveDB(); closeModal();
  const el=document.getElementById('settingsKBList');
  if(el) el.innerHTML=renderSettingsKBList();
}
function kbModal(id){
  let k=null;
  if(id) k=DB.knowledge.find(x=>x.id===id);
  // 将显示分类名映射回内部KB分类名用于预选
  const accuMap=ACCU_CATS.find(a=>a.display===kbCat);
  const defaultCat = k ? k.cat : (accuMap ? accuMap.cats[0] : kbCat);
  const catOpts=DB.kbCats.map(c=>`<option value="${c}" ${defaultCat===c?'selected':''}>${c}</option>`).join('');
  openModal(`<div class="modal-head"><h3>${id?'编辑':'新增'}知识</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>分类</label><select id="kb_cat">${catOpts}</select></div>
    <div class="form-group"><label>标题</label><input id="kb_title" value="${k?k.title:''}" placeholder="知识点标题"></div>
    <div class="form-group"><label>内容</label><textarea id="kb_content" placeholder="详细内容" style="min-height:120px;">${k?k.content:''}</textarea>
      <div style="font-size:10px;color:var(--text-light);margin-top:2px;">提示：以 <b>#</b> 开头的行是标题（如 # 一、高频词），保存后查看会显示为加粗标题</div></div>
    <div class="form-group"><label>📄 Word文档上传（.docx）</label>
      <input type="file" accept=".docx,.txt" onchange="uploadDoc(this)">
    </div>
    <div class="form-group"><label>飞书文档链接导入</label>
      <div class="form-row">
        <input id="kb_feishu_url" placeholder="粘贴飞书文档链接" style="flex:2" value="${k&&k.feishuUrl?k.feishuUrl:''}">
        <button class="btn btn-outline" style="flex:1" onclick="importFeishu()">抓取</button>
      </div>
      <div id="kb_feishu_status" style="font-size:11px;color:var(--text-soft);margin-top:4px;">支持 feishu.cn / larksuite.com 文档链接，自动抓取正文</div>
    </div>
    <div class="modal-foot">
      ${id?`<button class="btn btn-danger" style="flex:1" onclick="confirmDelKB('${id}')">删除</button>`:''}
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1" onclick="saveKB('${id||''}')">保存</button>
    </div>`);
}
function toggleRecKB(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    stopRec();
    // 录音结束，由于浏览器原生 SpeechRecognition 兼容性差，这里提示用户可手动编辑
    setTimeout(()=>{
      const audio=document.getElementById('kb_audio');
      if(audio.dataset.audio){
        toast('录音完成，建议手动整理为文字填入内容');
      }
    },300);
  }else{
    startRec('kb_audio');
  }
}
async function uploadDoc(input){
  const file=input.files[0];
  if(!file) return;
  if(file.name.endsWith('.txt')){
    const text=await file.text();
    document.getElementById('kb_content').value=text;
    toast('已导入文本');
  }else{
    // docx 简单处理：提示用户。真正解析需要 mammoth.js，这里动态加载
    toast('正在解析Word...');
    try{
      if(!window.mammoth){
        await loadScript('https://cdn.bootcdn.net/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      }
      const arrayBuffer=await file.arrayBuffer();
      const result=await window.mammoth.extractRawText({arrayBuffer});
      document.getElementById('kb_content').value=result.value;
      toast('已导入Word内容');
    }catch(e){
      toast('解析失败，请尝试.txt格式');
    }
  }
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}
/* 飞书文档链接导入 */
/* 代理列表：依次尝试，第一个成功的用 */
const FEISHU_PROXIES = [
  // 专用代理（如有部署则填入）
  // 'https://your-worker.workers.dev/?url=',
];
/* 公共抓取：返回 {title, content}；失败返回 null（私有文档需登录无法绕过） */
async function fetchFeishuContent(url){
  let html=null, ok=false, title='', content='';
  const candidates=[
    // 国内可达：自建代理服务（优先，速度最快）
    (u)=>NEWS_PROXY+'/api/feishu?url='+encodeURIComponent(u),
    ...FEISHU_PROXIES.map(p=>(u=>p+encodeURIComponent(u))),
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
  ];
  // 前两个候选：直接返回 JSON（news_proxy / 其他专用代理）
  for(let i=0;i<candidates.length;i++){
    try{
      const resp=await fetch(candidates[i](url), {signal:AbortSignal.timeout(15000)});
      if(!resp.ok) continue;
      const ct=resp.headers.get('content-type')||'';
      if(ct.includes('json') || candidates[i](url).includes('/api/feishu')){
        const j=await resp.json();
        if(j&&j.ok){
          title=j.title||''; content=j.content||''; ok=true; break;
        }
        if(j&&j.error){ return {ok:false, error:j.error}; }
      }else{
        html=await resp.text();
        if(html&&html.length>200){ ok=true; break; }
      }
    }catch(e){ continue; }
  }
  // 第三方代理返回的是 HTML → 解析
  if(ok && !title && html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    title=doc.querySelector('title')?.textContent?.replace(/[-—]\s*飞书.*$/,'').trim()||'';
    const contentEl=doc.querySelector('.docx-content')||doc.querySelector('article')||doc.querySelector('.wiki-content')||doc.body;
    if(contentEl) content=contentEl.innerText||contentEl.textContent||'';
    content=content.replace(/\n{3,}/g,'\n\n').trim();
    if(content.length<50){
      const meta=doc.querySelector('meta[name=description]')?.content||'';
      content=meta||content;
    }
  }
  if(!ok || content.length<20) return null;
  return {title, content};
}

  const url=document.getElementById('kb_feishu_url').value.trim();

/* 轻量 Markdown 渲染：`# 标题` → 加粗标题行；列表/段落保持 */
function renderMd(text){
  try{
    return String(text||'').split('\n').map(line=>{
      const m=line.match(/^(#{1,3})\s+(.*)$/);
      if(m){
        const lv=m[1].length;
        const size=lv===1?16:lv===2?15:14;
        return `<div style="font-weight:700;font-size:${size}px;color:var(--text);margin:10px 0 5px;line-height:1.4;">${escapeHtml(m[2])}</div>`;
      }
      if(!line.trim()) return '<div style="height:6px;"></div>';
      return `<div>${escapeHtml(line)}</div>`;
    }).join('');
  }catch(e){ return escapeHtml(text); }
}

/* 从错题的知识点字段导入易错考点（去重，并保留"复习提醒"，支持多行+兜底） */
function importMistakesFromErrors(){
  if(!DB.errors||!DB.errors.length){ toast('暂无错题数据'); return; }
  if(!DB.mistakes) DB.mistakes=[];
  let added=0, updated=0;
  DB.errors.forEach(e=>{
    // e.point 可能为"知识点\n复习提醒：xxx"多行格式
    const lines=(e.point||'').split('\n').map(s=>s.trim()).filter(Boolean);
    // 收集所有非复习提醒的行作为候选考点
    let points=lines.filter(l=>!/^复习提醒[：:]/.test(l));
    // 长度阈值放宽到 >=2（接受短缩写）
    points=points.filter(p=>p.length>=2);
    // 关键：若没有任何有效考点 → 用题目摘要 desc 兜底（避免漏导）
    if(!points.length && e.desc){
      const snippet=e.desc.replace(/[\s\u3000]+/g,'').slice(0,40);
      if(snippet) points=[snippet];
    }
    if(!points.length) return;
    // 提取"复习提醒：xxx"（兼容中文/英文冒号）→ 放进易错知识点字段
    const reviewLine=lines.find(l=>/^复习提醒[：:]/.test(l));
    const review=reviewLine?reviewLine.replace(/^复习提醒[：:]\s*/,''):'';
    const reviewPart=review?('复习提醒：'+review):'';
    // 每个候选考点都尝试导入（多行point→多考点）
    points.forEach(point=>{
      if(!point||point.length<2) return;
      // 已存在判断：比较知识点首行（去掉首尾空格后精确匹配）
      const exists=DB.mistakes.find(m=>{
        if(m.module!==e.module) return false;
        const mp=(m.point||'').split('\n')[0].trim();
        return mp===point;
      });
      if(exists){
        // 已存在该考点：复习提醒补充进"易错知识点"字段（而非备注）
        if(review && !(exists.point||'').includes(review)){
          exists.point=[exists.point,reviewPart].filter(Boolean).join('\n');
          exists.updatedAt=Date.now();
          updated++;
        }
        return;
      }
      // 复习提醒拼进易错知识点（与错题原文格式一致：知识点\n复习提醒：xxx）
      const fullPoint=[point,reviewPart].filter(Boolean).join('\n');
      DB.mistakes.push({id:uid(),module:e.module,sub:e.sub||'',point:fullPoint,date:e.date||todayStr(),note:'来自错题导入',updatedAt:Date.now()});
      added++;
    });
  });
  // 导入后去重：清理完全重复的考点（保留复习轮次更多的）
  dedupMistakes();
  saveDB();
  const fn=_detailReturnFnMistake;
  if(fn){ closeModal(); setTimeout(()=>window[fn](),50); }
  toast('已导入'+added+'条考点'+(updated?'，补充复习提醒'+updated+'条':''));
}
/* 去重易错考点：同模块+同知识点首行视为重复，保留复习轮次（stage）更大的那条 */
function dedupMistakes(){
  if(!DB.mistakes||!DB.mistakes.length) return;
  const keep=new Map(); // key → mistake
  const removeIds=[];
  DB.mistakes.forEach(m=>{
    const key=(m.module||'')+'|'+(m.point||'').split('\n')[0].trim();
    const cur=keep.get(key);
    if(!cur){
      keep.set(key,m);
    }else{
      // 比较复习轮次，保留 stage 更大的
      const curEbb=getMistakeEbb(cur);
      const mEbb=getMistakeEbb(m);
      if(mEbb.stage>curEbb.stage || (mEbb.stage===curEbb.stage && mEbb.done && !curEbb.done)){
        // 新的更好，替换
        removeIds.push(cur.id);
        keep.set(key,m);
      }else{
        // 当前的更好，跳过新的
        removeIds.push(m.id);
      }
    }
  });
  if(removeIds.length){
    DB.mistakes=DB.mistakes.filter(m=>!removeIds.includes(m.id));
    removeIds.forEach(id=>{ if(DB.mistakeEbb) delete DB.mistakeEbb[id]; markDeleted('mistakes',id); });
  }
}

/* 卡片正文折叠渲染：
   一级=【子标题】块（默认展开第一个，其余折叠）
   二级=分组标题（大作文/申论小题等），组内的【X】块再折叠一层
   三级=时政卡片内每条"· 标题"（可点击展开详情）
   考点/言语素材卡片不折叠（直接列表） */
function renderCardFolded(bodyLines, cardTitle){
  // 考点/言语素材：直接列表，不折叠
  if(cardTitle && (cardTitle.includes('考点') || cardTitle.includes('言语素材'))){
    return bodyLines.filter(l=>l.trim()).map(l=>`<div style="padding:3px 0;font-size:12px;color:var(--text);line-height:1.7;">${linkify(l)}</div>`).join('');
  }
  // 两级结构解析：分组标题（大作文/申论小题/人民时评等）→ 【X】块 → 行
  // v2.1.81 修复：人民时评提升为与申论小题、大作文平级的 GROUP
  const GROUP_RE=/^(大作文|申论小题|小题积累|作文素材|言语理解|人民时评)$/;
  const items=[];
  let g=null, b=null;
  const prelude=[]; // 块标题之前的行（合并显示）
  for(const line of bodyLines){
    const t=line.trim();
    if(!t) continue; // 跳过空行
    if(GROUP_RE.test(t)){
      g={type:'group',title:t,children:[]}; items.push(g); b=null; continue;
    }
    const tm=t.match(/^【([^】]+)】$/);
    if(tm){
      b={type:'block',title:tm[1],body:[]};
      if(g) g.children.push(b); else items.push(b);
      continue;
    }
    // 普通行：有当前块就追加，否则放入前言
    if(b){ b.body.push(line); continue; }
    prelude.push(line);
  }
  const isSZ=cardTitle&&cardTitle.includes('每日时政');
  const blockDetails=(bl, idx, indent)=>{
    return `<details ${idx===0?'open':''} style="margin-bottom:6px;${indent?'margin-left:8px;border-left:2px solid var(--border);padding-left:8px;':''}">
      <summary style="font-size:12px;font-weight:600;color:var(--text);cursor:pointer;padding:4px 0;display:flex;justify-content:space-between;align-items:center;">
        <span>${bl.title||'内容'}</span>
        <span style="color:var(--text-light);font-size:10px;">${idx===0?'收起▴':'展开▾'}</span>
      </summary>
      <div style="padding:4px 0 6px;">${renderBlockBody(bl, isSZ)}</div>
    </details>`;
  };
  // 前言直接渲染（合并为一个块，不再产生"内容"空标题块）
  const preludeHtml = prelude.length
    ? `<div style="margin-bottom:8px;padding:6px 8px;background:var(--bg-soft);border-radius:8px;font-size:12px;color:var(--text);line-height:1.7;">${prelude.map(l=>linkify(l)).join('<br>')}</div>`
    : '';
  let bi=0, gi=0;
  const itemsHtml = items.map(item=>{
    if(item.type==='group'){
      const inner=item.children.map((ch,j)=>blockDetails(ch,j,true)).join('');
      const open=gi===0; gi++;
      return `<details ${open?'open':''} style="margin-bottom:6px;">
        <summary style="font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;padding:4px 0;display:flex;justify-content:space-between;align-items:center;">
          <span>📂 ${item.title}</span>
          <span style="color:var(--text-light);font-size:10px;">${open?'收起▴':'展开▾'}</span>
        </summary>
        <div style="padding:4px 0 6px;">${inner||'<div style="font-size:11px;color:var(--text-light);padding:6px 0;">暂无内容</div>'}</div>
      </details>`;
    }
    const out=blockDetails(item, bi, false); bi++;
    return out;
  }).join('');
  return preludeHtml + itemsHtml;
}
/* 渲染单个块的正文（时政卡片/人民时评：每条"· 标题"默认展开显示链接+摘要；其他：列表） */
function renderBlockBody(b, isSZ){
  // v2.1.81 修复：人民时评块也用 isSZ 样式渲染，使链接可见且可展开
  if(isSZ || (b.title&&b.title.includes('人民时评'))){
    // 每条"· xxx"作为标题，其后行（链接/摘要）直接展示，默认全部展开
    const items=[];
    let item=null;
    for(const ln of b.body){
      const m=ln.match(/^· (.+)$/);
      if(m){
        if(item) items.push(item);
        item={sum:m[1], body:[]};
      }else if(item){
        item.body.push(ln);
      }else{
        if(!item) item={sum:'', body:[]};
        item.body.push(ln);
      }
    }
    if(item) items.push(item);
    return items.map(it=>{
      const lines=it.body.filter(l=>l.trim());
      // body 行（链接/摘要）也要 linkify，否则纯文本 URL 在华为浏览器显示蓝色但不可点击
      const body=linkify(lines.join('\n')).replace(/\n/g,'<br>');
      if(!body) return `<div style="padding:3px 0;font-size:12px;color:var(--text);">${linkify(it.sum)}</div>`;
      return `<details open style="padding:3px 0;border-bottom:1px dashed var(--border);">
        <summary style="font-size:12px;color:var(--text);cursor:pointer;padding:2px 0;display:flex;justify-content:space-between;align-items:center;">
          <span style="flex:1;min-width:0;">${linkify(it.sum)}</span>
          <span style="color:var(--text-light);font-size:10px;margin-left:6px;">收起▾</span>
        </summary>
        <div style="font-size:11px;color:var(--text-soft);padding:4px 0 6px;line-height:1.6;word-break:break-all;">${body}</div>
      </details>`;
    }).join('');
  }
  const lines=b.body.filter(l=>l.trim());
  if(!lines.length){
    return `<div style="font-size:11px;color:var(--text-light);padding:6px 0;">暂无内容，可到知识库添加</div>`;
  }
  return `<div style="font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-all;line-height:1.7;">${linkify(lines.join('\n'))}</div>`;
}
/* 转义HTML+把URL/javascript伪协议变为可点击链接 */
function linkify(text){
  // 清洗旧版本推送残留的百度搜索链接 → 换成 gov.cn 要闻列表（点击不再跳百度）
  if(typeof text==='string' && text.indexOf('baidu.com/s?wd=')>-1){
    text=text.replace(/https?:\/\/www\.baidu\.com\/s\?wd=[^\s"'<>()]+/g,'https://www.gov.cn/yaowen/');
  }
  return escapeHtml(text).replace(/(https?:\/\/[^\s]+)|\(javascript:([^)]+)\)/g, (m,url,js)=>{
    // 链接点击：尝试 window.open 新标签（同步 preventDefault）；被拦截时整页导航（带滚动位置保存）
    if(url) return `<a href="${url}" onclick="return openLink(event,this)" style="color:var(--info);text-decoration:underline;word-break:break-all;">${url}</a>`;
    if(js) return `(<a href="javascript:${js}" style="color:var(--primary);font-weight:600;">[查看]</a>)`;
    return m;
  });
}
/* 链接点击：优先新标签打开；被拦截时整页导航（先保存滚动位置让返回时精确定位） */
function openLink(e, a){
  try{
    if(e){ e.preventDefault(); e.stopPropagation(); }
  }catch(_){}
  const url = a.href;
  // 尝试新标签打开（用户手势，浏览器通常允许）
  try{
    const w = window.open(url, '_blank', 'noopener');
    if(w){ w.opener=null; return false; }
    // 浏览器拦截：整页导航（先保存滚动位置和当前位置）
  }catch(_){}
  // 兜底：整页导航，先保存滚动位置；返回时浏览器历史里有 #push + localStorage 滚动位置 → 恢复
  try{ saveScrollPos(); }catch(_){}
  try{ localStorage.setItem('gk_last_tab', location.hash.replace('#','') || 'home'); }catch(_){}
  // 注意：不要用 location.href 去导航（让浏览器原生点击链接行为生效）
  return true;
}

function addPush(type,title,content,fetchInfo){

  const cutoff=new Date(today); cutoff.setDate(cutoff.getDate()-7);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  DB.pushHistory = (DB.pushHistory||[]).filter(p => {
    const d = (p.time||'').match(/(\d{4})\/(\d+)\/(\d+)/);
    const dateStr = d ? `${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}` : '';
    return dateStr >= cutoffStr;
  });
  // 同类型同日期的旧推送只保留最新一条（避免"重新生成"时旧版内容堆积）
  // v2.1.99 修复：toLocaleString('zh-CN') 生成"2026/8/10"（无零填充），
  // 之前用 today.replace(/-/g,'/')="2026/08/10" 做 includes 匹配失败，旧推送没被清除
  if(type){
    const dayStart=new Date(today+'T00:00:00').getTime();
    const dayEnd=dayStart+86400000;
    DB.pushHistory=DB.pushHistory.filter(p=>!(p.type===type && p.ts>=dayStart && p.ts<dayEnd));
  }
  DB.pushHistory.push({id:uid(),type,title,content,time:new Date().toLocaleString('zh-CN'),ts:Date.now(),fetchInfo:fetchInfo||''});
  if(DB.pushHistory.length>100) DB.pushHistory=DB.pushHistory.slice(-100);
  saveDB();
}
/* 强制重新抓取：清除今天的推送标记和历史 + 重新生成早间和晚间推送 */
async function forceRefreshPush(){
  // 清除今天的推送标记，允许重新生成
  const today=todayStr();
  if(DB.settings.lastPush){
    DB.settings.lastPush=DB.settings.lastPush.split(',').filter(p=>!p.startsWith(today+'_')).join(',');
    saveDB();
  }
  // 清除今天的推送历史（避免新旧内容堆积）
  DB.pushHistory=(DB.pushHistory||[]).filter(p=>{
    const d=(p.time||'').match(/(\d{4})\/(\d+)\/(\d+)/);
    const ds=d?`${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}`:'';
    return ds!==today;
  });
  saveDB();
  try{ localStorage.removeItem(NEWS_CACHE_KEY); }catch(e){}
  toast('正在重新生成推送...');
  try{
    await generateMorningPush();
    // 如果当前时间已过22点，也重新生成晚间推送
    const h=new Date().getHours();
    if(h>=22){
      generateNightPush();
    }
    toast('推送已重新生成');
  }catch(e){
    console.error('forceRefreshPush error:',e);
    toast('生成失败：'+String(e.message||e));
  }
}
/* 检查案例是否有实际内容（过滤纯空案例）。
   "案例一：红旗渠...苦干实干…… → 可论证：艰苦奋斗 → 可论证：" → 有内容，返回 true
   "案例二：→ 可论证：" → 纯空，返回 false（跳过）
   完整案例正文保留，但结尾空的"→ 可论证："（冒号后无内容）要清理掉，
   有内容的"→ 可论证：xxx"保留。 */
function isCaseValid(text){
  if(!text) return false;
  const s=text.trim();
  // 去掉"案例X："前缀后检查是否有实际内容
  const after=s.replace(/^案例[一二三四五六七八九十\d]+[：:]\s*/,'').trim();
  // 去掉所有"→ 可论证：xxx"模板占位符后看还剩什么
  const real=after.replace(/→\s*可论证[：:][^\n]*/g,'').replace(/[→\s]/g,'').trim();
  return real.length>=4;
}
/* 清理案例文本：去掉结尾空的"→ 可论证："（冒号后无内容或只有空白），
   有内容的"→ 可论证：xxx"保留不动。
   例如："案例正文…… → 可论证：精准识别需求 → 可论证： → 可论证："
   清理后："案例正文…… → 可论证：精准识别需求" */
function cleanCaseTail(text){
  if(!text) return text;
  // 把所有"→ 可论证："按顺序处理，只保留有内容的
  // 用[^→]*防止匹配跨越到下一个→可论证
  return text.replace(/→\s*可论证[：:]\s*([^→\n]*)/g, (match, after)=>{
    const content=after.trim();
    if(content) return match; // 有内容的原样保留
    return ''; // 空的删掉
  }).replace(/\s+$/,'').trim(); // 清理结尾多余空白
}
/* 智能解析申论素材（兼容Word导出格式：子分类标题无【】、跳过"用途"行）
   返回结构化数组：[{topic:'高质量发展', sections:{'开篇金句':[...],'分论点框架':[...],...}}] */
function parseShenlunContent(records){
  // 子分类关键词（长词优先）
  const subTypes=['开篇金句','结尾金句','分论点框架','点明观点','阐述意义','分析问题','提出对策','案例举证','愿景展望','行动号召','金句','案例'];
  const subTypeRe=subTypes.join('|');
  // 目录关键词（一级/二级目录跳过）
  const skipHead=['哲学基础','思想方法','马克思辩证唯物主义','毛泽东哲学思想','新思想','名词解释','写作素材'];
  const results=[];
  let curTopic='';
  let curSections={}; // {type: [texts]}
  const flushTopic=()=>{
    if(Object.values(curSections).some(a=>a&&a.length)){
      results.push({topic:curTopic||'未分类', sections:curSections});
    }
    curTopic=''; curSections={};
  };
  records.forEach(k=>{
    const txt=(k.content||'');
    const lines=txt.split(/\n+/).map(s=>s.trim().replace(/^[▼▷▶\s#*]+/,'').replace(/[*#]+$/,'')).filter(Boolean);
    for(const line of lines){
      if(!line) continue;
      // 1) 子分类标题（独立行，可带【】或冒号）："开篇金句"、"点明观点："、"【金句】"
      const subTitle=line.match(new RegExp(`^[【\\[]?(${subTypeRe})[】\\]]?[:：]?$`));
      if(subTitle){
        curSections[subTitle[1]]=curSections[subTitle[1]]||[];
        continue;
      }
      // 1.5) 编号+子分类标题："（一）开篇金句"、"1. 金句"（视为子分类而非话题）
      const numberedSub=line.match(new RegExp(`^[（(][一二三四五六七八九十\\d]+[）)]\\s*(${subTypeRe})[：:]?$`))||
                        line.match(new RegExp(`^\\d+[.、]\\s*(${subTypeRe})[：:]?$`));
      if(numberedSub){
        const t=numberedSub[1];
        curSections[t]=curSections[t]||[];
        continue;
      }
      // 2) 话题标题：仅识别（一）（二）…、1. 2. 等编号标题（含冒号的编号行视为内容而非话题）
      const isTopic=line.length<=30 && line.length>=3 && !/[：:]/.test(line) && (
        /^（[一二三四五六七八九十\d]+）/.test(line)||
        /^\d+[\.、]/.test(line)
      );
      if(isTopic){
        flushTopic();
        curTopic=line;
        curSections={};
        continue;
      }
      // 3) 大目录标题（跳过）
      if(skipHead.some(s=>line===s||line===s+'：'||line.endsWith(s))) continue;
      // 4) "用途："说明行（跳过）
      if(/^用途[：:]/.test(line)) continue;
      // 5) 一级目录即话题标题："一、乡村振兴"（短行，像目录）
      if(/^[一二三四五六七八九十]+[、，]/.test(line)&&line.length<=20){
        flushTopic();
        curTopic=line;
        curSections={};
        continue;
      }
      // 6) 普通内容：归到当前子分类（默认"观点"）
      const typesArr=Object.keys(curSections);
      const type=typesArr.length?typesArr[typesArr.length-1]:'观点';
      if(!curSections[type]) curSections[type]=[];
      if(type==='案例举证'||type==='案例'){
        // 案例块：以"案例X："开头开始新案例，其余行追加到当前案例
        if(/^案例[一二三四五六七八九十\d]+[：:]/.test(line)){
          // 有实际内容的案例原样保留，纯空案例跳过
          if(isCaseValid(line)){
            curSections[type].push(line);
          }
        }else{
          // 跳过空的"→ 可论证："（冒号后无内容），有内容的保留
          if(/^→\s*可论证[：:]\s*$/.test(line)) continue;
          if(curSections[type].length) curSections[type][curSections[type].length-1]+='\n'+line;
          else curSections[type].push(line);
        }
      }else{
        curSections[type].push(line);
      }
    }
  });
  flushTopic();
  return results;
}
/* 从解析结果中提取某子分类的所有内容（过滤空案例） */
function pickSection(results, types){
  const items=[];
  results.forEach(r=>{
    types.forEach(t=>{
      (r.sections[t]||[]).forEach(x=>{
        const clean=x.trim();
        if(clean.length<6) return; // 太短跳过
        // 案例类：纯空案例跳过，有内容的清理结尾空"→可论证："后保留
        if(/^案例[一二三四五六七八九十\d]+[：:]/.test(clean)){
          if(!isCaseValid(clean)) return; // 空案例跳过
          items.push(cleanCaseTail(clean));
        }else{
          items.push(clean);
        }
      });
    });
  });
  return items;
}
/* 专项解析"申论小题积累"文档：
   一、规范表达 / 二、对策积累（XX类话题） / 三、常用矛盾范畴 */
function parseXiaoTi(records){
  const result={}; // {分类: [内容]}
  let curCat='';
  let curTopic='';
  records.forEach(k=>{
    const lines=(k.content||'').split(/\n+/).map(s=>s.trim().replace(/^[▼▷▶\s#*]+/,'').replace(/[*#]+$/,'')).filter(Boolean);
    for(const line of lines){
      // 一级标题：一、二、三、
      const m1=line.match(/^[一二三四五六七八九十]+、(.+)$/);
      if(m1){ curCat=m1[1].trim(); curTopic=''; continue; }
      // 二级：（一）（二）
      const m2=line.match(/^（[一二三四五六七八九十\d]+）(.+)$/);
      if(m2){ curTopic=m2[1].trim(); continue; }
      // XX类话题 / XX话题
      const m3=line.match(/^(.+(?:类话题|话题))$/);
      if(m3){ curTopic=m3[1].trim(); continue; }
      // 内容行
      if(line.length>=6 && !/^用途[：:]/.test(line)){
        const key=curTopic?curCat+'·'+curTopic:curCat;
        if(!key) continue;
        if(!result[key]) result[key]=[];
        result[key].push(line);
      }
    }
  });
  return result;
}

/* 随机洗牌工具 */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
/* 基于种子的确定性 shuffle（同一种子+同一数组 → 同一结果） */
function seededShuffle(arr, seed){
  const a=[...arr];
  let s=seed;
  for(let i=a.length-1;i>0;i--){
    s=(s*9301+49297)%233280;
    const j=Math.floor((s/233280)*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ===== 实时新闻抓取（v2.1.12）=====
   通道1：公网代理（抓 gov.cn/gd.gov.cn/求是网/人民网观点，返回解析好的 JSON，带 CORS）
   通道2：gov.cn 直连（file:// 下 gov.cn 放行 CORS，实测可用，作为 gov 双保险）
   缓存 30 分钟，避免每次刷新都耗流量 */
const NEWS_PROXY='https://a2cd80842a90bd0f0.gz5.agentos-app.net';
const NEWS_CACHE_KEY='gk_news_cache_v1';
async function fetchProxyNews(src){
  try{
    const r=await fetch(NEWS_PROXY+'/api/news?src='+src,{signal:AbortSignal.timeout(12000)});
    if(!r.ok) return [];
    const j=await r.json();
    return (j.items||[]).map(x=>({title:(x.t||'').trim(),url:(x.u||'').trim(),date:(x.d||'').trim(),src:(x.s||'').trim(),digest:(x.digest||'').trim()}));
  }catch(e){ return []; }
}
/* 手机端直连 gov.cn 首页解析（正则与代理端一致） */
function parseGovLocal(html){
  const items=[], seen=new Set();
  const re=/<a[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
  let m;
  while((m=re.exec(html))){
    const href=m[1];
    const t=m[2].replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
    if(t.length<10) continue;
    if(!/www\.gov\.cn\/.*content_\d+\.htm/.test(href)) continue;
    if(/国务院部门网站|地方政府网站|驻港澳机构网站|中国政府网微博/.test(t)) continue;
    const url=href.startsWith('http')?href:'https://www.gov.cn'+href;
    const key=url.split('#')[0];
    if(seen.has(key)) continue;
    seen.add(key);
    const dm=href.match(/\/(20\d{2})(\d{2})\//);
    items.push({title:t.slice(0,60),url,date:dm?dm[1]+'-'+dm[2]:'',src:'中国政府网'});
    if(items.length>=10) break;
  }
  return items;
}
/* 抓取四源：gov(时政)/gd(广东)/qs(求是理论)/rm(人民网观点)，带30分钟缓存 */
async function fetchLiveNews(force){
  const now=Date.now();
  try{
    const c=JSON.parse(localStorage.getItem(NEWS_CACHE_KEY)||'null');
    if(c&&c.t&&now-c.t<30*60*1000&&!force&&(c.gov.length||c.gd.length)){
      // 旧版本缓存可能缺 llk/plsp/nfpl 等字段，兜底为空数组（v2.1.81 修复：补 plsp）
      ['gov','gd','qs','rm','llk','plsp','nfpl'].forEach(k=>{ if(!Array.isArray(c[k])) c[k]=[]; });
      return c;
    }
  }catch(e){}
  const [govR,gdR,qsR,rmR,llkR,plspR,nfplR]=await Promise.allSettled([
    fetchProxyNews('gov'),fetchProxyNews('gd'),fetchProxyNews('qs'),fetchProxyNews('rm'),fetchProxyNews('rmllk'),fetchProxyNews('plsp'),fetchProxyNews('nfpl')
  ]);
  const result={
    t:now,
    gov:(govR.status==='fulfilled'?govR.value:[]).filter(x=>x.title),
    gd:(gdR.status==='fulfilled'?gdR.value:[]).filter(x=>x.title),
    qs:(qsR.status==='fulfilled'?qsR.value:[]).filter(x=>x.title),
    rm:(rmR.status==='fulfilled'?rmR.value:[]).filter(x=>x.title),
    llk:(llkR.status==='fulfilled'?llkR.value:[]).filter(x=>x.title),
    plsp:(plspR.status==='fulfilled'?plspR.value:[]).filter(x=>x.title),
    nfpl:(nfplR.status==='fulfilled'?nfplR.value:[]).filter(x=>x.title),
    via:'代理'
  };
  // gov 双保险：代理失败则直连 gov.cn（file:// 下放行 CORS）
  if(!result.gov.length){
    try{
      const res=await fetch('https://www.gov.cn/index.htm',{signal:AbortSignal.timeout(10000)});
      if(res.ok){
        const html=await res.text();
        result.gov=parseGovLocal(html);
        result.via='直连';
      }
    }catch(e){}
  }
  try{ localStorage.setItem(NEWS_CACHE_KEY,JSON.stringify(result)); }catch(e){}
  return result;
}
/* 时间显示：MM-DD HH:MM */
function fmtNewsTime(ts){
  const d=new Date(ts);
  const p=n=>String(n).padStart(2,'0');
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

async function generateMorningPush(){
  try{
    const today=todayStr();
    let content='';
    // ① 薄弱模块提醒（易错考点/错题复习已移到主页"待复习"区，推送不再重复列出）
    content+='【① 薄弱模块提醒】\n';
    const ebbErrCount=DB.errors.filter(e=>{const st=getErrorEbb(e);return !st.done&&st.next<=today;}).length;
    const ebbMkCount=(DB.mistakes||[]).filter(m=>{const st=getMistakeEbb(m);return !st.done&&st.next<=today;}).length;
    if(ebbErrCount||ebbMkCount){
      content+='· 今日待复习：错题 '+ebbErrCount+' 条、考点 '+ebbMkCount+' 条（主页「今日待复习」打卡复习）\n';
    }
    const moduleCount={};
    DB.errors.forEach(e=>{ moduleCount[e.module]=(moduleCount[e.module]||0)+1; });
    const sorted=Object.entries(moduleCount).sort((a,b)=>b[1]-a[1]);
    if(sorted.length){
      const weakModule=sorted[0];
      const mod=MODULES.find(m=>m.key===weakModule[0]);
      content+='\n📊 错题最多【'+ (mod?mod.name:'') +'】模块重点：\n'+getModuleTips(weakModule[0]);
    }
    // ② 言语/申论/时政内容已移至「积累」页面，推送不再重复

    addPush('早间推送','每日学习推送 '+today,content);
    renderPush();
    toast('已生成今日早间推送');
  }catch(e){
    console.error('generateMorningPush error:',e);
    toast('早间推送生成失败：'+String(e.message||e));
  }
}

function generateNightPush(){
  const today=todayStr();
  const todayRecords=DB.records.filter(r=>r.date===today);
  const total=todayRecords.reduce((s,r)=>s+r.total,0);
  const correct=todayRecords.reduce((s,r)=>s+r.correct,0);
  const rate=total?Math.round(correct/total*100):0;
  const studyHours=DB.studyCheckins[today]||0;
  const reviews=DB.reviews.filter(r=>r.date===today).length;
  let content=`今日学习情况：\n· 刷题：${total}题，正确率${rate}%\n· 学习时长：${studyHours}h\n· 复盘记录：${reviews}条\n\n`;
  content+='请填写今日学习总结与复盘：\n1. 今天学到了什么？\n2. 哪些地方还不够熟练？\n3. 明天的计划是什么？\n\n';
  content+='点击主页"每日复盘"板块，记录今日所学。坚持复盘，方能进步！💪';
  addPush('晚间推送','每日复盘提醒 '+today,content);
  renderPush();
  toast('已生成晚间复盘提醒');
}
function generateWeeklyReport(){
  const week=getRecentDates(7);
  const weekErrors=DB.errors.filter(e=>week.includes(e.date));
  let content='本周错题汇总报告\n'+new Date().toLocaleDateString('zh-CN')+'\n\n';
  content+=`一、本周错题总数：${weekErrors.length}题\n\n`;
  // 按模块统计
  const moduleCount={};
  weekErrors.forEach(e=>{ moduleCount[e.module]=(moduleCount[e.module]||0)+1; });
  const sorted=Object.entries(moduleCount).sort((a,b)=>b[1]-a[1]);
  content+='二、各板块错题分布：\n';
  if(sorted.length){
    sorted.forEach(([k,v])=>{
      const mod=MODULES.find(m=>m.key===k);
      content+=`· ${mod?mod.name:''}：${v}题\n`;
    });
  }else{
    content+='本周无错题记录，棒！\n';
  }
  content+='\n三、薄弱点提炼：\n';
  if(sorted.length){
    const top=sorted.slice(0,3);
    top.forEach(([k,v])=>{
      const mod=MODULES.find(m=>m.key===k);
      const modErrors=weekErrors.filter(e=>e.module===k);
      const points=modErrors.map(e=>e.point).filter(Boolean);
      content+=`· 【${mod?mod.name:''}】${v}题错\n`;
      if(points.length) content+=`  知识点：${points.slice(0,3).join('；')}\n`;
    });
  }
  content+='\n四、提升方向建议：\n';
  if(sorted.length){
    const weak=sorted[0][0];
    const mod=MODULES.find(m=>m.key===weak);
    content+=`1. 重点攻克【${mod?mod.name:''}】，建议本周增加该模块练习量\n`;
    content+='2. 整理错题本，归纳同类题型解题方法\n';
    content+='3. 结合每日考点推送，强化薄弱知识点记忆\n';
    content+='4. 每日复盘，记录易错点避免重复犯错\n';
  }else{
    content+='继续保持，稳扎稳打！\n';
  }
  addPush('周报','📊 每周错题汇总报告',content);
  renderPush();
  toast('已生成本周错题报告');
}

/* ============================================================
   定时提醒检查（每次打开应用时检查）
   ============================================================ */
function checkScheduledPush(){
  if(DB.settings.autoPush===false) return; // 定时推送已关闭
  const now=new Date();
  const h=now.getHours();
  const today=todayStr();
  const lastPush=DB.settings.lastPush||'';
  // 早7点后且今天没推过早间
  if(h>=7 && !lastPush.includes(today+'_morning')){
    DB.settings.lastPush=(lastPush?lastPush+',':'')+today+'_morning';
    saveDB();
    generateMorningPush().then(()=>{
      toast('早间推送已生成');
    }).catch(e=>{
      console.error('早间推送生成失败',e);
      toast('早间推送生成失败');
    });
  }
  // 晚22点后且今天没推过晚间
  if(h>=22 && !lastPush.includes(today+'_night')){
    DB.settings.lastPush=(DB.settings.lastPush?DB.settings.lastPush+',':'')+today+'_night';
    saveDB();
    generateNightPush();
    toast('晚间复盘提醒');
  }
}

  if(!DB._mkSubBackfill){
    (DB.mistakes||[]).forEach(m=>{
      if(!m.sub && m.recId){

  // 反推完成日（旧 next - 旧间隔）后按新间隔重算；兼容 v2.2.18 已修正过的宽松排期
  if(!DB._ebbIntervalV3){
    const OLD = DB._ebbIntervalV2 ? [0,2,4,7,15] : [1,2,4,7,15]; // v2.2.18 宽松间隔 vs 更早错位间隔
    const fixEbb=(ebb)=>{
      if(!ebb) return;
      Object.values(ebb).forEach(st=>{
        if(!st||st.done||st.pending) return;
        const s=st.stage||0;
        if(s<1||!st.next) return;
        const comp=new Date(st.next+'T00:00:00');
        if(isNaN(comp.getTime())) return;
        comp.setDate(comp.getDate()-OLD[s-1]); // 反推完成日
        const nd=new Date(localDateStr(comp)+'T00:00:00');
        nd.setDate(nd.getDate()+EBB_DAYS[s]);  // 标准间隔 1/2/4/7/15
        st.next=localDateStr(nd);

/* 动态加载 supabase-js SDK（jsdelivr 主 + unpkg 备） */
function loadSupabaseSDK(){
  return new Promise((resolve, reject)=>{
    if(window.supabase && window.supabase.createClient) return resolve(window.supabase);
    const urls = [
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
      'https://unpkg.com/@supabase/supabase-js@2',
      NEWS_PROXY + '/supabase.min.js',
      'https://registry.npmmirror.com/@supabase/supabase-js/2.49.0/files/dist/umd/supabase.min.js'
    ];
    let i = 0;
    (function tryLoad(){
      if(i >= urls.length) return reject(new Error('SDK 加载失败'));
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = () => (window.supabase && window.supabase.createClient) ? resolve(window.supabase) : tryLoad();
      s.onerror = tryLoad;
      document.head.appendChild(s);
    })();
  });
}
/* 初始化：建 client + 探测连接 + 首次自动拉取 */
async function initSupabase(){
  try{
    setSyncState('connecting');
    const sb = await Promise.race([
      loadSupabaseSDK(),
      new Promise((_, rej)=>setTimeout(()=>rej(new Error('SDK 加载超时')), 15000))
    ]);
    const cfg = getSupabaseCfg();
    supabaseClient = sb.createClient(cfg.url, cfg.key);
    // 连接探测：查一行（表不存在会报错）
    await supabaseClient.from('workbench_sync').select('user_key').limit(1);
    setSyncState('connected');
    if(cfg.auto !== false){ syncPullAndMerge(); startSyncPolling(); }
  }catch(e){
    setSyncState('error');
    console.warn('[Supabase]', e && e.message);
  }
}
/* v2.1.81 SYNC-002: 定时轮询拉取云端变更（防止频繁推送导致冲突，静默拉取+合并） */
function startSyncPolling(){
  stopSyncPolling();
  _syncPollTimer = setInterval(async()=>{
    // 仅在自动同步开启且非推送中时静默拉取
    const cfg = getSupabaseCfg();
    if(cfg.auto === false || _syncPushing || !supabaseClient) return;
    // 检查云端 updated_at 是否比上次拉取新（12s 超时兜底，网络挂起时静默跳过本轮）
    try{
      const { data, error } = await Promise.race([
        supabaseClient
          .from('workbench_sync')
          .select('updated_at,device')
          .eq('user_key', getSyncKey())
          .maybeSingle(),
        new Promise((_, rej)=>setTimeout(()=>rej(new Error('poll timeout')), 12000))
      ]);
      if(error || !data) return;
      // 如果云端设备不是本设备，且更新时间比上次同步新，才拉取合并
      if(data.device && data.device !== getDeviceId()){
        const cloudT = new Date(data.updated_at).getTime();
        const lastT = (DB.settings && DB.settings.lastSyncTimeTs) || 0;
        if(cloudT > lastT){
          await syncPullAndMerge();
        }
      }
    }catch(e){ /* 静默失败，不打扰用户 */ }
  }, SYNC_POLL_INTERVAL);
}
function stopSyncPolling(){
  if(_syncPollTimer){ clearInterval(_syncPollTimer); _syncPollTimer = null; }
}
